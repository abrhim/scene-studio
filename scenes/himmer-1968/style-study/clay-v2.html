<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft clay v2</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #2a2620; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  .hud { position: absolute; font: 500 13px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(250, 240, 214, 0.78); pointer-events: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
  #fps { right: 16px; top: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  #title { left: 24px; top: 18px; color: #fdf6e2; }
  #title b { display: block; font: 600 22px/1.15 Georgia, 'Palatino Linotype', serif; letter-spacing: 0.02em; }
  #title span { display: block; margin-top: 5px; font: italic 14px/1.3 Georgia, serif; color: #f0e2bc; max-width: 520px; }
  #picker { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(40, 34, 30, 0.62); border: 1px solid rgba(240, 212, 138, 0.45); }
  #picker button { font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f6ecd2; background: transparent; border: 0; border-radius: 999px; padding: 8px 13px; cursor: pointer; letter-spacing: 0.02em; }
  #picker button:hover { background: rgba(240, 212, 138, 0.16); }
  #picker button[aria-pressed="true"] { background: #f0d48a; color: #2b241a; }
  #picker button:focus-visible { outline: 2px solid #f0d48a; outline-offset: 2px; }
  #info { left: 50%; bottom: 52px; transform: translateX(-50%); text-align: center; }
  #info .n { display: inline-block; font: 600 19px/1.15 Georgia, 'Palatino Linotype', serif; color: #fdf6e2; padding: 6px 15px 5px; border-radius: 999px; background: rgba(40, 34, 30, 0.74); border: 1px solid rgba(240, 212, 138, 0.7); }
  #info .t { margin-top: 7px; font-variant-numeric: tabular-nums; color: #f6ecd2; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
  .lab { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; font: 600 15px/1.2 Georgia, serif; color: #fdf6e2; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); pointer-events: none; }
  .lab small { display: block; font: 500 12px/1.3 system-ui, sans-serif; color: #f0e2bc; font-variant-numeric: tabular-nums; }
  #keys { left: 24px; bottom: 16px; }
</style>
</head>
<body>
<div id="title" class="hud"><b>Soft clay, second pass</b><span>Company C, 1st Battalion, 9th Marines, 16 April 1968. A rifleman, the captain and his radioman, and an NVA soldier, on one head rig.</span></div>
<div id="picker" role="group" aria-label="Figure">
  <button data-v="all">All</button>
  <button data-v="rifleman">Rifleman</button>
  <button data-v="captain">Captain</button>
  <button data-v="radioman">Radioman</button>
  <button data-v="nva">NVA</button>
  <button data-v="compare">Compare v1</button>
</div>
<div id="fps" class="hud"></div>
<div id="info" class="hud"></div>
<div id="keys" class="hud">← → pick · space turntable · F face (again: next face) · E expression · W walk · K kneel · D slump · C compare v1</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="figkit.js"></script>
<script src="style-a.js"></script>
<script src="clay-v2.js"></script>
<script>
// ?fig=all|rifleman|captain|radioman|nva|compare  ?shot=view|face|far  ?face=0..3  ?expr=steady|strained|calm|alert
// ?mode=idle|walk|kneel|fall  ?spin=0  ?yaw=<camera orbit, radians>  ?dist=<metres, for shot=far>  ?t0=<seconds>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const FK = window.FK, V = FK.V, lin = FK.lin, TAU = Math.PI * 2, smooth = FK.smooth, V2 = window.V2;
  const T0 = Number(params.get('t0') || 0);
  let spin = params.get('spin') !== '0';
  const yaw0 = Number(params.get('yaw') || 0);
  let view = params.get('fig') || 'all', shot = params.get('shot') || 'view';

  // ---------- renderer: ACES, sRGB, warm key low in the south-west, warm ground bounce, a warm rim from behind ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  {
    const c = document.createElement('canvas'); c.width = 4; c.height = 512;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
    gr.addColorStop(0, '#6a98c6'); gr.addColorStop(0.32, '#b2c9da'); gr.addColorStop(0.56, '#efd8ae'); gr.addColorStop(1, '#e3c08e');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    scene.background = tex;
  }
  scene.fog = new THREE.Fog(lin(0xe6cfa2), 40, 140);
  const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 400);
  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xc9b07a, 0.66));
  const sun = new THREE.DirectionalLight(0xffdfb4, 1.5);
  sun.position.set(-9, 8, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 40 });
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.015;
  scene.add(sun, sun.target);
  const rimL = new THREE.DirectionalLight(0xffd29a, 0.55);
  rimL.position.set(7, 5, -9);
  scene.add(rimL);
  const fill = new THREE.DirectionalLight(0xfff4e6, 0.22);
  fill.position.set(4, 4, 30);
  scene.add(fill);

  // ---------- the ground: a sloped patch with 2 m elephant grass behind and beside, short tufts in front ----------
  const R = 3.6;
  const heightAt = (x, z) => -0.12 * z + 0.04 * Math.sin(1.5 * x + 0.4) * Math.cos(1.2 * z) + 0.05 * Math.max(0, -z - 1.6) * Math.max(0, -z - 1.6);
  const SPOTS = { rifleman: [-1.15, 0.55, 0.35], captain: [0.2, 0.05, 0.18], radioman: [1.0, -0.5, -0.5], nva: [2.45, 0.85, -0.75] };
  {
    const rings = 22, segs = 72, pos = [], tris = [], grid = [];
    for (let i = 0; i <= rings; i++) {
      const row = [], r = (i / rings) * R;
      for (let k = 0; k < segs; k++) {
        const a = (k / segs) * TAU + (i % 2) * (TAU / segs / 2);
        const x = Math.sin(a) * r, z = Math.cos(a) * r;
        row.push(pos.length / 3); pos.push(x, heightAt(x, z), z);
      }
      grid.push(row);
    }
    for (let i = 0; i < rings; i++) for (let k = 0; k < segs; k++) {
      const a = grid[i][k], b = grid[i][(k + 1) % segs], c = grid[i + 1][k], d = grid[i + 1][(k + 1) % segs];
      if (i === 0) { tris.push(a, c, d); continue; }
      if (i % 2 === 0) tris.push(a, c, d, a, d, b); else tris.push(a, c, b, b, c, d);
    }
    const top = grid[rings], base = [];
    for (let k = 0; k < segs; k++) { const x = pos[top[k] * 3], z = pos[top[k] * 3 + 2]; base.push(pos.length / 3); pos.push(x * 1.03, -0.6, z * 1.03); }
    for (let k = 0; k < segs; k++) { const a = top[k], b = top[(k + 1) % segs], c = base[k], d = base[(k + 1) % segs]; tris.push(a, c, d, a, d, b); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(tris); g.computeVertexNormals();
    FK.paint(g, (x, y, z) => {
      if (y < heightAt(x, z) - 0.04) return y > -0.25 ? 0x8a5434 : 0x6a3f28;
      const nn = FK.noise(x * 1.3 + 4, 0, z * 1.3), path = Math.abs(x * 0.35 + z * 0.9 - 0.1) < 0.36 && z > -1.6;
      if (path || nn > 0.74) return 0xa8683f;
      return nn < 0.35 ? 0x8d9c55 : nn < 0.55 ? 0x9aa45c : 0xaaa462;
    });
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
    m.receiveShadow = true;
    scene.add(m);
  }
  {
    const rnd = FK.rand(77), blades = [];
    const clump = (x, z, h, nb, tall) => {
      for (let i = 0; i < nb; i++) {
        const hh = h * (0.65 + rnd() * 0.45);
        const g = FK.blade({ h: hh, w: tall ? 0.07 : 0.05, t: 0.018, bend: 0.25 + rnd() * 0.45, segs: tall ? 7 : 5, sides: 6, tip: 0.85, smooth: true });
        const a = rnd() * TAU, off = rnd() * 0.14;
        g.applyMatrix4(FK.M(x + Math.cos(a) * off, heightAt(x, z) - 0.02, z + Math.sin(a) * off, 0, a, -0.08 - rnd() * 0.28));
        const tint = rnd();
        FK.paint(g, (px, py, pz, h2) => (h2 > 0.72 ? (tint > 0.5 ? 0xccbd74 : 0xbab66a) : h2 > 0.35 ? (tint > 0.6 ? 0x9aa45a : 0x8a9c50) : 0x6c8440));
        blades.push(g);
      }
    };
    // tall grass: a horseshoe behind and beside, and a screen between the Marines and the NVA soldier
    for (let i = 0; i < 46; i++) {
      const a = Math.PI * 0.5 + (i / 45) * Math.PI + (rnd() - 0.5) * 0.08, r = R * (0.66 + rnd() * 0.3);
      const x = Math.sin(a) * r, z = Math.cos(a) * r;
      clump(x, z, 1.5 + smooth((-z + 0.5) / 2.5) * 0.9 + rnd() * 0.4, 7, true);
    }
    for (let i = 0; i < 6; i++) clump(1.75 + rnd() * 0.25, -0.1 + i * 0.32 + rnd() * 0.1, 1.4 + rnd() * 0.5, 6, true);
    for (let i = 0; i < 40; i++) {
      const a = rnd() * TAU, r = R * (0.2 + Math.sqrt(rnd()) * 0.75), x = Math.sin(a) * r, z = Math.cos(a) * r;
      let near = false;
      for (const k in SPOTS) if (Math.hypot(SPOTS[k][0] - x, SPOTS[k][1] - z) < 0.5) near = true;
      if (Math.abs(x) < 1.2 && z > 1.4 && z < 2.6) near = true;
      if (!near) clump(x, z, 0.25 + rnd() * 0.3, 4, false);
    }
    const gg = FK.concatH(blades);
    gg.computeBoundingSphere();
    const grass = new THREE.Mesh(gg, FK.sway(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, side: THREE.DoubleSide }), 'v2'));
    grass.castShadow = true; grass.receiveShadow = true;
    scene.add(grass);
  }

  // ---------- figures ----------
  const MAT = V2.material();
  function blobTex() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 2, 32, 32, 31);
    gr.addColorStop(0, 'rgba(50,38,22,0.45)'); gr.addColorStop(1, 'rgba(50,38,22,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const BLOB = new THREE.MeshBasicMaterial({ map: blobTex(), transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
  const exprName = params.get('expr') || 'steady';
  const A0 = { mode: params.get('mode') || 'idle', prev: params.get('mode') || 'idle', tMode: T0, expr: V2.EXPR[exprName], exprPrev: V2.EXPR[exprName], tExpr: T0, exprName };
  const figs = {};
  const KINDS = ['rifleman', 'captain', 'radioman', 'nva'];
  const SEEDS = { rifleman: 1, captain: 2, radioman: 3, nva: 4, lo: 1, v1: 1 };
  function place(F, key) {
    const [x, z, yaw] = F.spot;
    const y = heightAt(x, z);
    F.root.position.set(x, y, z); F.root.rotation.y = yaw;
    F.blob.position.set(x, y + 0.012, z); F.blob.rotation.y = yaw;
  }
  function makeFig(kind, key, opt) {
    if (figs[key]) { scene.remove(figs[key].root); scene.remove(figs[key].blob); figs[key].mesh.geometry.dispose(); }
    const F = V2.build(kind, Object.assign({ mat: MAT }, opt || {}));
    F.key = key; F.seed = SEEDS[key] || 1; F.spot = SPOTS[key] || SPOTS[kind];
    F.A = Object.assign({}, A0);
    F.blob = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.8).rotateX(-Math.PI / 2), BLOB);
    F.blob.renderOrder = 1;
    scene.add(F.root, F.blob);
    place(F, key);
    figs[key] = F;
    return F;
  }
  let faceIdx = params.has('face') ? Number(params.get('face')) : null;
  for (const k of KINDS) makeFig(k, k, k === 'rifleman' && faceIdx !== null ? { face: faceIdx } : {});
  // the far level of detail of the rifleman, and v1's rifleman, for the compare view
  const lo = makeFig('rifleman', 'lo', { lod: 0, face: faceIdx !== null ? faceIdx : 0 });
  lo.spot = [0.9, 0.3, 0.2];
  let v1 = null;
  {
    const S = window.STYLES.a, mats = S.materials();
    const F = S.build('rifleman', mats);
    F.chest0 = F.asm.j.chest.position.clone();
    F.root = F.asm.root; F.blob = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.8).rotateX(-Math.PI / 2), BLOB);
    F.spot = [-0.9, 0.3, 0.2];
    scene.add(F.root, F.blob);
    place(F);
    v1 = F;
  }
  function animateV1(F, t) {
    const j = F.asm.j, br = Math.sin((t * TAU) / 4.4 + 2.1);
    j.chest.position.copy(F.chest0); j.chest.position.y += 0.004 * br;
    j.head.rotation.set(0.04, FK.glance(t, 1, 9, 0.5), 0);
    if (j.eyes) j.eyes.scale.y = FK.blink(t, 1);
    const b = F.asm.sk.bind.chest;
    FK.solveArm(F.asm, 'R', F.rifle.R.clone().sub(b), V(-1, -0.6, -0.5));
    FK.solveArm(F.asm, 'L', F.rifle.L.clone().sub(b), V(0.9, -1, -0.1));
  }

  // ---------- picker, keys ----------
  const buttons = [...document.querySelectorAll('#picker button')];
  const VIEWS = ['all', 'rifleman', 'captain', 'radioman', 'nva', 'compare'];
  let camT = -1, clockT = T0;
  function setView(v) {
    view = v;
    for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.v === v));
    if (v === 'all' || v === 'compare') shot = 'view';
    camT = -1;
  }
  buttons.forEach((b) => b.addEventListener('click', () => setView(b.dataset.v)));
  const focusFig = () => figs[view] || figs.rifleman;
  function setMode(m) {
    for (const k in figs) { const A = figs[k].A; A.prev = A.mode; A.mode = A.mode === m ? 'idle' : m; A.tMode = clockT; }
    camT = Math.max(camT, 0);
  }
  function setExpr(name) {
    for (const k in figs) { const A = figs[k].A; A.exprPrev = Object.assign({}, figs[k].ex || A.expr); A.expr = V2.EXPR[name]; A.tExpr = clockT; A.exprName = name; }
  }
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') setView(VIEWS[(VIEWS.indexOf(view) + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length]);
    else if (e.key === ' ') { spin = !spin; e.preventDefault(); }
    else if (k === 'f') {
      if (view === 'all' || view === 'compare') setView('rifleman');
      if (shot === 'face') {
        // next face on the focused figure (the NVA soldier keeps his own)
        const F = focusFig();
        if (F.kind !== 'nva') { const i = ((F.faceIdx === undefined ? V2.FACES.indexOf(F.face) : F.faceIdx) + 1) % 4; const A = F.A; const NF = makeFig(F.kind, F.key, { face: i }); NF.faceIdx = i; NF.A = A; }
      }
      shot = 'face'; camT = -1;
    } else if (k === 'e') { const names = V2.EXPR_NAMES; setExpr(names[(names.indexOf(focusFig().A.exprName) + 1) % 4]); }
    else if (k === 'w') setMode('walk');
    else if (k === 'k') setMode('kneel');
    else if (k === 'd') setMode('fall');
    else if (k === 'c') setView(view === 'compare' ? 'rifleman' : 'compare');
    else if (k === 'v') { shot = 'view'; camT = -1; }
  });
  setView(view);

  // ---------- camera ----------
  const camPos = V(0, 0, 0), camLook = V(0, 0, 0), wantPos = V(0, 0, 0), wantLook = V(0, 0, 0), hw = V(0, 0, 0);
  function cameraWant(orbit) {
    if (params.has('cam')) { const c = params.get('cam').split(',').map(Number); wantPos.set(c[0], c[1], c[2]); wantLook.set(c[3], c[4], c[5]); camera.fov = Number(params.get('fov') || 30); return; }
    if (view === 'all') {
      camera.fov = 30;
      wantLook.set(0.55, 0.8, 0.1);
      const d = 10.5, a = 0.12 + orbit * 0.4;
      wantPos.set(wantLook.x + Math.sin(a) * d, 2.7, wantLook.z + Math.cos(a) * d);
      return;
    }
    if (view === 'compare') {
      camera.fov = 26;
      wantLook.set(0, 0.95, 0.3);
      wantPos.set(Math.sin(0.3 + orbit) * 6.4, 1.55, 0.3 + Math.cos(0.3 + orbit) * 6.4);
      return;
    }
    const F = focusFig(), [x, z, yaw] = F.spot, y = heightAt(x, z);
    const a = yaw + 0.55 + orbit;
    if (shot === 'face') {
      F.j.head.getWorldPosition(hw);
      hw.y += 0.2;
      camera.fov = 18;
      wantLook.copy(hw); wantLook.y -= 0.01;
      wantPos.set(hw.x + Math.sin(a) * 1.9, hw.y + 0.03, hw.z + Math.cos(a) * 1.9);
    } else if (shot === 'far') {
      const d = Number(params.get('dist') || 10);
      camera.fov = 30;
      wantLook.set(x, y + 0.9, z);
      wantPos.set(x + Math.sin(a) * d, y + 1.6 + d * 0.06, z + Math.cos(a) * d);
    } else {
      camera.fov = 28;
      const mode = F.A.mode;
      wantLook.set(x, y + (mode === 'fall' ? 0.45 : mode === 'kneel' ? 0.65 : 0.92), z);
      wantPos.set(x + Math.sin(a) * 4.2, y + 1.35, z + Math.cos(a) * 4.2);
    }
  }

  // ---------- labels ----------
  const info = document.getElementById('info');
  const fmt = (x) => x.toLocaleString('en-US');
  const labs = {};
  for (const key of ['v1', 'rifleman', 'lo']) { const d = document.createElement('div'); d.className = 'lab'; document.body.appendChild(d); labs[key] = d; }
  const labPos = V(0, 0, 0);

  // ---------- frame loop (pure function of the clock; ?t0 picks the moment) ----------
  const fpsEl = document.getElementById('fps');
  let last = performance.now(), turn = 0, fpsFrames = 0, fpsTime = 0;
  function frame() {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const t = T0 + now / 1000;
    clockT = t;
    if (spin) turn += dt;
    FK.time.value = t;
    const cmp = view === 'compare';
    for (const k in figs) {
      const F = figs[k];
      if (k === 'lo') { F.spot = cmp ? [0.95, 0.3, 0.2] : [9, 9, 0]; place(F); }
      if (k === 'rifleman') { F.spot = cmp ? [0, 0.3, 0.2] : SPOTS.rifleman; place(F); }
      const vis = cmp ? k === 'rifleman' || k === 'lo' : shot === 'face' && view !== 'all' ? figs[view] === F : k !== 'lo';
      F.root.visible = F.blob.visible = vis;
      if (vis) V2.animate(F, t, F.A);
    }
    v1.root.visible = v1.blob.visible = cmp;
    if (cmp) animateV1(v1, t);
    cameraWant(turn * 0.25 + yaw0);
    if (camT < 0) { camPos.copy(wantPos); camLook.copy(wantLook); camT = 0; }
    else { const k = 1 - Math.exp(-dt * 4); camPos.lerp(wantPos, k); camLook.lerp(wantLook, k); }
    camera.position.copy(camPos); camera.lookAt(camLook);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    // labels
    const F = focusFig();
    if (cmp) info.innerHTML = '<div class="n">v1 and v2, side by side</div><div class="t">v1 ' + fmt(v1.asm.tris) + ' triangles · v2 hero ' + fmt(figs.rifleman.tris) + ' · v2 far level ' + fmt(lo.tris) + ' (for figures past 80 m)</div>';
    else if (view === 'all') info.innerHTML = '<div class="n">Soft clay v2</div><div class="t">rifleman ' + fmt(figs.rifleman.tris) + ' · captain ' + fmt(figs.captain.tris) + ' · radioman ' + fmt(figs.radioman.tris) + ' · NVA ' + fmt(figs.nva.tris) + ' triangles · one mesh, one material each</div>';
    else info.innerHTML = '<div class="n">' + ({ rifleman: 'Rifleman', captain: 'Captain', radioman: 'Radioman', nva: 'NVA soldier' })[F.kind] + '</div><div class="t">' + F.face.name + (F.kind === 'nva' ? '' : ' of 4') + ' · ' + F.face.note + ' · ' + F.A.exprName + ' · ' + F.A.mode + ' · ' + fmt(F.tris) + ' triangles</div>';
    for (const key in labs) {
      const d = labs[key], G0 = key === 'v1' ? v1 : figs[key];
      d.style.display = cmp ? 'block' : 'none';
      if (!cmp) continue;
      labPos.copy(G0.root.position); labPos.y -= 0.12; labPos.project(camera);
      d.style.left = ((labPos.x + 1) / 2) * innerWidth + 'px'; d.style.top = ((1 - labPos.y) / 2) * innerHeight + 'px';
      d.innerHTML = (key === 'v1' ? 'v1' : key === 'lo' ? 'v2, far level' : 'v2, hero') + '<small>' + fmt(key === 'v1' ? G0.asm.tris : G0.tris) + ' triangles</small>';
    }
    renderer.render(scene, camera);
    fpsFrames++; fpsTime += dt;
    if (fpsTime >= 0.5 || !window.__statsOnce) {
      window.__statsOnce = true;
      const r = renderer.info.render;
      fpsEl.textContent = Math.round(fpsFrames / Math.max(fpsTime, 0.001)) + ' fps · ' + r.calls + ' draws · ' + (r.triangles / 1000).toFixed(1) + 'k tris';
      fpsFrames = 0; fpsTime = 0;
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
  window.__figs = figs; window.__v1 = v1;
  window.__ready = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
