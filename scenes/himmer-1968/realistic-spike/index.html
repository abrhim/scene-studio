<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realistic Marine spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2a3a; }
  canvas { display: block; }
  .hud { position: fixed; font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(250, 240, 214, 0.8); letter-spacing: 0.02em; pointer-events: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
  #caption { left: 16px; bottom: 14px; }
  #fps { right: 16px; top: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  #keys { left: 16px; top: 14px; }
</style>
</head>
<body>
<div id="keys" class="hud">T turntable · W walk · F face · L level of detail · M platoon · C next clip · E mood</div>
<div id="caption" class="hud">US Marine rifleman, April 1968 · MPFB2 + Blender kit, built by build_marine.py</div>
<div id="fps" class="hud">-- fps</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- cdnjs's r128 has no examples/ folder; these are the same r128 files from jsdelivr -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
// Spike: one realistic Marine (glb from build_marine.py) on sloped ground in elephant grass, lit like the studio template.
// ?mode=turn|walk|face|platoon  ?lod=1  ?clip=Walk|Stand|<mixamo file name>  ?anim=folder (default anim/)
(function () {
  'use strict';
  window.__ready = false;
  const params = new URLSearchParams(location.search);
  let MODE = params.get('mode') || 'turn';
  let LOD = params.get('lod') === '1';
  const ANIM_DIR = params.get('anim') || 'anim/';
  const BG = params.get('bg'); // ?bg=ff00ff: flat background, no fog, for finding holes
  const PIN = params.has('cam') ? params.get('cam').split(',').map(Number) : null; // ?cam=x,y,z,tx,ty,tz relative to the figure
  const FOLLOW = params.get('follow') === '1'; // walk mode: the camera travels with him
  const ORBIT = params.has('orbit') ? Number(params.get('orbit')) * Math.PI / 180 : null; // fixed turntable angle, degrees
  const TAU = Math.PI * 2;
  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rand = mulberry32(19680416);

  // ---------- renderer (as template/index.html: sRGB out, ACES, exposure 1.12) ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 900);
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

  // sky: warm afternoon gradient, also the environment for reflections
  const HORIZON = '#efe0bf';
  function skyCanvas(w, h, withGround) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#5d93c9'); gr.addColorStop(0.3, '#a9c9e2'); gr.addColorStop(0.48, HORIZON);
    if (withGround) { gr.addColorStop(0.52, '#8c7a55'); gr.addColorStop(1, '#4e4630'); } else gr.addColorStop(1, HORIZON);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (withGround) { g.fillStyle = 'rgba(255,240,200,0.9)'; g.beginPath(); g.arc(w * 0.62, h * 0.30, 6, 0, TAU); g.fill(); }
    return c;
  }
  const skyTex = new THREE.CanvasTexture(skyCanvas(4, 512, false)); skyTex.encoding = THREE.sRGBEncoding;
  scene.background = skyTex;
  const envSrc = new THREE.CanvasTexture(skyCanvas(256, 128, true)); envSrc.encoding = THREE.sRGBEncoding; envSrc.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envSrc).texture;
  scene.fog = new THREE.FogExp2(lin(HORIZON).getHex(), 0.011);
  scene.fog.color = new THREE.Color(HORIZON);
  if (BG) { scene.background = new THREE.Color('#' + BG); scene.fog = null; }

  // light, as the template: hemisphere bounce, warm key, soft fill; the key is a low afternoon sun
  const hemi = new THREE.HemisphereLight(0xdfe9ff, 0xc9b07a, 0.55);
  const sun = new THREE.DirectionalLight(0xffe0b4, 1.55);
  sun.position.set(-7, 6.5, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 30 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  const fill = new THREE.DirectionalLight(0xfff6ea, 0.25); fill.position.set(6, 3, -4);
  scene.add(hemi, sun, sun.target, fill);

  // ---------- ground: a slope rising to -z, flat along x (the walk follows the contour) ----------
  const SLOPE = 0.11;
  function n2(x, z) { return Math.sin(x * 0.21 + Math.sin(z * 0.17) * 2) * 0.5 + Math.sin(z * 0.33 - x * 0.12) * 0.35 + Math.sin(x * 0.9 + z * 0.7) * 0.08; }
  function groundY(x, z) { const near = Math.min(1, Math.max(0, (Math.abs(z) - 2.5) / 6)); return -SLOPE * z + n2(x, z) * 0.35 * near + n2(x * 3, z * 3) * 0.03; }
  {
    const geo = new THREE.PlaneGeometry(260, 260, 160, 160); geo.rotateX(-Math.PI / 2);
    const p = geo.attributes.position, col = new Float32Array(p.count * 3);
    const a = lin(0x7d6a48), b = lin(0x8e8a55), c = new THREE.Color();
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, groundY(x, z)); c.copy(a).lerp(b, 0.5 + 0.5 * Math.sin(x * 0.3 + z * 0.4) * Math.cos(z * 0.21)); col.set([c.r, c.g, c.b], i * 3); }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
    const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
    g.fillStyle = '#b0a080'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2600; i++) { const v = 120 + rand() * 90; g.fillStyle = `rgba(${v | 0},${(v * 0.9) | 0},${(v * 0.62) | 0},0.5)`; g.fillRect(rand() * 256, rand() * 256, 1 + rand() * 3, 1 + rand() * 2); }
    for (let i = 0; i < 500; i++) { g.strokeStyle = `rgba(${150 + rand() * 60 | 0},${140 + rand() * 50 | 0},${70 + rand() * 30 | 0},0.6)`; g.beginPath(); const x = rand() * 256, y = rand() * 256; g.moveTo(x, y); g.lineTo(x + (rand() - 0.5) * 14, y + (rand() - 0.5) * 14); g.stroke(); }
    const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(90, 90); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: t, vertexColors: true, roughness: 0.95 }));
    ground.receiveShadow = true; scene.add(ground);
  }

  // ---------- elephant grass, 2 m: instanced clumps of bent blade cards, swaying ----------
  const wind = { value: 0 };
  {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 512; const g = cv.getContext('2d');
    for (let i = 0; i < 46; i++) {
      const x = 8 + rand() * 240, top = 10 + rand() * 120, w = 3 + rand() * 4, lean = (rand() - 0.5) * 60;
      const k = rand(); const r = 120 + k * 80, gg = 125 + k * 50, bb = 55 + k * 25;
      const grd = g.createLinearGradient(0, 512, 0, top); grd.addColorStop(0, `rgb(${r * 0.55 | 0},${gg * 0.6 | 0},${bb * 0.5 | 0})`); grd.addColorStop(0.6, `rgb(${r * 0.85 | 0},${gg | 0},${bb | 0})`); grd.addColorStop(1, `rgb(${r + 40 | 0},${gg + 30 | 0},${bb + 20 | 0})`);
      g.fillStyle = grd; g.beginPath(); g.moveTo(x - w, 512); g.quadraticCurveTo(x - w * 0.6 + lean * 0.3, (512 + top) / 2, x + lean, top); g.quadraticCurveTo(x + w * 0.6 + lean * 0.3, (512 + top) / 2, x + w, 512); g.fill();
    }
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
    const pos = [], uv = [], idx = [];
    for (let q = 0; q < 4; q++) {
      const ang = q * Math.PI / 4 + rand() * 0.3, cx = Math.cos(ang), sz = Math.sin(ang), W = 0.75, H = 2.0 + rand() * 0.4, bend = 0.25 + rand() * 0.3, base = pos.length / 3;
      for (let j = 0; j <= 4; j++) { const t = j / 4, y = H * t, off = bend * t * t; for (const s of [-1, 1]) { pos.push(cx * W * s + sz * off, y, sz * W * s - cx * off); uv.push((s + 1) / 2, t); } }
      for (let j = 0; j < 4; j++) { const a = base + j * 2; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.setIndex(idx); geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.85 });
    mat.onBeforeCompile = (sh) => { sh.uniforms.uWind = wind; sh.vertexShader = 'uniform float uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wp = instanceMatrix * vec4(0.,0.,0.,1.); float h2 = position.y * position.y * 0.25;
      transformed.x += h2 * 0.12 * sin(uWind * 1.3 + wp.x * 0.35 + wp.z * 0.2); transformed.z += h2 * 0.08 * sin(uWind * 1.7 + wp.z * 0.4);`); };
    const spots = [];
    for (let i = 0; i < 26000 && spots.length < 5200; i++) {
      const x = (rand() - 0.5) * 150, z = (rand() - 0.5) * 120 - 10;
      const patch = Math.sin(x * 0.13 + 1.3) * Math.sin(z * 0.11 + 0.4) + Math.sin(x * 0.05 - z * 0.07) * 0.6;
      if (patch < 0.15) continue;
      if (Math.hypot(x, z) < 3.6 || Math.abs(z) < 1.6 || (z > 0 && z < 7.5 && Math.abs(x) < 7)) continue; // the clearing, the trail, the camera bay
      spots.push([x, z]);
    }
    const inst = new THREE.InstancedMesh(geo, mat, spots.length), m = new THREE.Matrix4(), q4 = new THREE.Quaternion(), s3 = new THREE.Vector3();
    spots.forEach(([x, z], i) => { q4.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rand() * TAU); const s = 0.8 + rand() * 0.4; s3.set(s, s * (0.85 + rand() * 0.3), s); m.compose(new THREE.Vector3(x, groundY(x, z) - 0.05, z), q4, s3); inst.setMatrixAt(i, m); });
    inst.receiveShadow = true; scene.add(inst);
  }

  // ---------- the Marine ----------
  const stats = { hero: 0, lod: 0 };
  const hud = document.getElementById('fps');
  const loader = new THREE.GLTFLoader();
  const load = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));
  let hero, heroLod, mixer, mixerLod, clips = {}, clipNames = [], clipIdx = 0, current = null, currentLod = null, platoon = null, headBone = null;
  const vatTime = { value: 0 };
  const WALK_SPEED = 1.15; // m/s, matches build_marine.py SPEED (the clip is in place, feet slide back at this speed)

  function countTris(root) { let n = 0; root.traverse((o) => { if (o.isMesh) n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return n; }
  function prep(root) { root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; o.material.envMapIntensity = 0.9; } }); }

  function playClip(name) {
    const c = clips[name]; if (!c) return;
    const a = mixer.clipAction(c); const first = !current; if (current && current !== a) current.fadeOut(0.25); a.reset(); if (!first) a.fadeIn(0.25); a.play(); current = a;
    const al = mixerLod.clipAction(c); if (currentLod && currentLod !== al) currentLod.fadeOut(0.25); al.reset(); if (!first) al.fadeIn(0.25); al.play(); currentLod = al;
    clipIdx = clipNames.indexOf(name);
  }

  // ---------- 30 figures: baked vertex animation (the LOD's walk sampled to textures), one instanced draw per material ----------
  function buildPlatoon(gltf) {
    const root = gltf.scene, mx = new THREE.AnimationMixer(root), clip = clips.Walk, F = 24;
    mx.clipAction(clip).play();
    const meshes = []; root.traverse((o) => { if (o.isSkinnedMesh) meshes.push(o); });
    const group = new THREE.Group();
    const N_INST = 30, phases = new Float32Array(N_INST);
    for (let i = 0; i < N_INST; i++) phases[i] = rand();
    const data = meshes.map((m) => { const n = m.geometry.attributes.position.count, W = Math.min(n, 2048), rows = Math.ceil(n / W); return { m, n, W, rows, pos: new Float32Array(W * rows * F * 4), nrm: new Float32Array(W * rows * F * 4) }; });
    const v = new THREE.Vector3(), tmp = new THREE.BufferGeometry();
    for (let f = 0; f < F; f++) {
      mx.setTime(f / F * clip.duration); root.updateMatrixWorld(true);
      for (const d of data) {
        d.m.skeleton.update();
        const arr = new Float32Array(d.n * 3);
        for (let i = 0; i < d.n; i++) { d.m.boneTransform(i, v); v.applyMatrix4(d.m.matrixWorld); arr.set([v.x, v.y, v.z], i * 3); }
        tmp.setAttribute('position', new THREE.BufferAttribute(arr, 3)); tmp.setIndex(d.m.geometry.index); tmp.computeVertexNormals();
        const nn = tmp.attributes.normal.array, base = f * d.rows * d.W * 4;
        for (let i = 0; i < d.n; i++) { d.pos.set([arr[i * 3], arr[i * 3 + 1], arr[i * 3 + 2], 1], base + i * 4); d.nrm.set([nn[i * 3], nn[i * 3 + 1], nn[i * 3 + 2], 0], base + i * 4); }
      }
    }
    for (const d of data) {
      const H = d.rows * F;
      const mk = (a) => { const t = new THREE.DataTexture(a, d.W, H, THREE.RGBAFormat, THREE.FloatType); t.magFilter = t.minFilter = THREE.NearestFilter; t.needsUpdate = true; return t; };
      const posT = mk(d.pos), nrmT = mk(d.nrm);
      const geo = new THREE.BufferGeometry();
      for (const k of ['position', 'normal', 'uv']) if (d.m.geometry.attributes[k]) geo.setAttribute(k, d.m.geometry.attributes[k]);
      geo.setIndex(d.m.geometry.index);
      const ids = new Float32Array(d.n); for (let i = 0; i < d.n; i++) ids[i] = i; geo.setAttribute('vatId', new THREE.BufferAttribute(ids, 1));
      geo.setAttribute('vatPhase', new THREE.InstancedBufferAttribute(phases, 1));
      const mat = d.m.material.clone(); mat.skinning = false;
      mat.onBeforeCompile = (sh) => {
        Object.assign(sh.uniforms, { vatPos: { value: posT }, vatNrm: { value: nrmT }, vatInfo: { value: new THREE.Vector4(d.W, d.rows, F, H) }, vatTime });
        sh.vertexShader = `attribute float vatId; attribute float vatPhase; uniform sampler2D vatPos; uniform sampler2D vatNrm; uniform vec4 vatInfo; uniform float vatTime;
          vec2 vatUV(float id, float fr) { float x = mod(id, vatInfo.x); float y = floor(id / vatInfo.x) + fr * vatInfo.y; return vec2((x + 0.5) / vatInfo.x, (y + 0.5) / vatInfo.w); }
          ` + sh.vertexShader
          .replace('#include <beginnormal_vertex>', `float vft = fract(vatTime + vatPhase) * vatInfo.z; float vf0 = floor(vft); float vf1 = mod(vf0 + 1.0, vatInfo.z); float va = vft - vf0;
            vec3 objectNormal = normalize(mix(texture2D(vatNrm, vatUV(vatId, vf0)).xyz, texture2D(vatNrm, vatUV(vatId, vf1)).xyz, va));`)
          .replace('#include <begin_vertex>', 'vec3 transformed = mix(texture2D(vatPos, vatUV(vatId, vf0)).xyz, texture2D(vatPos, vatUV(vatId, vf1)).xyz, va);');
      };
      const im = new THREE.InstancedMesh(geo, mat, N_INST); im.frustumCulled = false; im.castShadow = false; im.receiveShadow = true;
      group.add(im);
    }
    group.userData.layout = Array.from({ length: N_INST }, (_, i) => ({ x0: (i % 6) * 10 - 25 + (rand() - 0.5) * 2, z: Math.floor(i / 6) * 10 - 20 + (rand() - 0.5) * 2 }));
    group.visible = false; scene.add(group); return group;
  }
  function updatePlatoon(t) {
    const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2), one = new THREE.Vector3(1, 1, 1);
    platoon.userData.layout.forEach((L, i) => { const x = ((L.x0 + WALK_SPEED * t + 30) % 60 + 60) % 60 - 30; m.compose(new THREE.Vector3(x, groundY(x, L.z), L.z), q, one); for (const im of platoon.children) im.setMatrixAt(i, m); });
    for (const im of platoon.children) im.instanceMatrix.needsUpdate = true;
  }

  // ---------- Mixamo clips: anim/*.fbx, retargeted onto this rig by world-space rotation deltas ----------
  const MIX = { Hips: 'pelvis', Spine: 'spine_01', Spine1: 'spine_02', Spine2: 'spine_03', Neck: 'neck_01', Head: 'head' };
  for (const [S, s] of [['Left', 'l'], ['Right', 'r']]) {
    Object.assign(MIX, { [S + 'Shoulder']: 'clavicle_' + s, [S + 'Arm']: 'upperarm_' + s, [S + 'ForeArm']: 'lowerarm_' + s, [S + 'Hand']: 'hand_' + s, [S + 'UpLeg']: 'thigh_' + s, [S + 'Leg']: 'calf_' + s, [S + 'Foot']: 'foot_' + s, [S + 'ToeBase']: 'ball_' + s });
    for (const [F, f] of [['Thumb', 'thumb'], ['Index', 'index'], ['Middle', 'middle'], ['Ring', 'ring'], ['Pinky', 'pinky']]) for (let k = 1; k <= 3; k++) MIX[S + 'Hand' + F + k] = f + '_0' + k + '_' + s;
  }
  const mixKey = (n) => n.replace(/^mixamorig\d*[:_]?/i, '');
  let tposeRef = null; // target bones' world quaternions (and pelvis position) in the T-pose the user uploaded to Mixamo
  function captureTpose() {
    const m = new THREE.AnimationMixer(hero); m.clipAction(clips.TPose).play(); m.setTime(0); hero.updateMatrixWorld(true);
    tposeRef = {}; hero.traverse((o) => { if (o.isBone) tposeRef[o.name] = { q: o.getWorldQuaternion(new THREE.Quaternion()), p: o.getWorldPosition(new THREE.Vector3()) }; });
    m.stopAllAction(); m.uncacheRoot(hero);
  }
  let bindRest = null; // X Bot T-pose from the With-Skin file's bind matrices, relative to the FBX root
  function readBind(obj) {
    let sk = null; obj.traverse((o) => { if (o.isSkinnedMesh && !sk) sk = o; });
    if (!sk) return null;
    const r = {}, q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
    sk.skeleton.bones.forEach((b, i) => { new THREE.Matrix4().copy(sk.skeleton.boneInverses[i]).invert().decompose(p, q, sc); r[mixKey(b.name)] = { q: q.clone(), p: p.clone() }; });
    return r;
  }
  function relTo(root, bone, q, p) { // bone rotation / position in the FBX root's frame
    const rq = root.getWorldQuaternion(new THREE.Quaternion()).invert();
    if (q) bone.getWorldQuaternion(q).premultiply(rq);
    if (p) { bone.getWorldPosition(p); p.applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert()); }
  }
  function retarget(src, clip, name) {
    const bones = {}; src.traverse((o) => { if (o.isBone || o.type === 'Bone' || MIX[mixKey(o.name)]) bones[mixKey(o.name)] = o; });
    src.updateMatrixWorld(true);
    const rest = {};
    for (const k in bones) { if (bindRest && bindRest[k]) rest[k] = bindRest[k]; else { const q = new THREE.Quaternion(), p = new THREE.Vector3(); relTo(src, bones[k], q, p); rest[k] = { q, p }; } }
    const tb = {}; hero.traverse((o) => { if (o.isBone) tb[o.name] = o; });
    const pairs = Object.keys(MIX).filter((k) => bones[k] && tb[MIX[k]]);
    if (!bones.Hips) throw new Error('no Hips bone in ' + name);
    const hipScale = tposeRef.pelvis.p.y / Math.max(1e-6, rest.Hips.p.y);
    const m = new THREE.AnimationMixer(src); m.clipAction(clip).play();
    const fps = 30, n = Math.max(2, Math.round(clip.duration * fps) + 1), times = new Float32Array(n);
    const hipAt = (t) => { m.setTime(t); src.updateMatrixWorld(true); const p = new THREE.Vector3(); relTo(src, bones.Hips, null, p); return p; };
    const h0 = hipAt(0), h1 = hipAt(clip.duration * 0.999);
    const speed = Math.hypot(h1.x - h0.x, h1.z - h0.z) * hipScale / Math.max(0.1, clip.duration);
    const qv = {}; pairs.forEach((k) => { qv[k] = new Float32Array(n * 4); });
    const pv = new Float32Array(n * 3);
    const order = []; (function walk(o) { if (o.isBone) order.push(o.name); o.children.forEach(walk); })(hero);
    const inv = {}; const qs = new THREE.Quaternion(), qt = new THREE.Quaternion();
    for (let i = 0; i < n; i++) {
      const t = Math.min(clip.duration, i / fps); times[i] = t; m.setTime(t); src.updateMatrixWorld(true);
      const world = {};
      for (const tn of order) { // parents before children
        const k = Object.keys(MIX).find((kk) => MIX[kk] === tn && bones[kk]);
        if (k) { relTo(src, bones[k], qs, null); qt.copy(qs).multiply(inv[k] || (inv[k] = rest[k].q.clone().invert())).multiply(tposeRef[tn].q); world[tn] = qt.clone(); }
        else world[tn] = tposeRef[tn].q.clone();
        const par = tb[tn].parent; const pq = par && par.isBone ? world[par.name] : par.getWorldQuaternion(new THREE.Quaternion());
        const local = pq.clone().invert().multiply(world[tn]);
        if (k) local.toArray(qv[k], i * 4);
      }
      const hpos = new THREE.Vector3(); relTo(src, bones.Hips, null, hpos);
      const hp = hpos.sub(rest.Hips.p).multiplyScalar(hipScale).add(tposeRef.pelvis.p);
      hp.x = tposeRef.pelvis.p.x; hp.z = tposeRef.pelvis.p.z; // root motion stripped: the page moves the figure
      const par = tb.pelvis.parent; par.updateMatrixWorld(true);
      hp.applyMatrix4(new THREE.Matrix4().copy(par.matrixWorld).invert()); hp.toArray(pv, i * 3);
    }
    const tracks = pairs.map((k) => new THREE.QuaternionKeyframeTrack(MIX[k] + '.quaternion', times, qv[k]));
    tracks.push(new THREE.VectorKeyframeTrack('pelvis.position', times, pv));
    const out = new THREE.AnimationClip(name, clip.duration, tracks);
    out.userData = { speed, mixamo: true }; // m/s of the stripped root motion: the page moves the figure at this speed
    return out;
  }
  async function loadMixamo() {
    let files = [];
    try { const html = await (await fetch(ANIM_DIR)).text(); files = [...new Set([...html.matchAll(/href="([^"?#]+\.fbx)"/gi)].map((x) => decodeURIComponent(x[1])))]; } catch (e) { /* no folder: use the built-in walk */ }
    if (!files.length) return;
    const fl = new THREE.FBXLoader();
    captureTpose();
    files.sort((a, b) => (/with skin|rifle walk/i.test(b) ? 1 : 0) - (/with skin|rifle walk/i.test(a) ? 1 : 0));
    for (const f of files) {
      try {
        const obj = await new Promise((res, rej) => fl.load(ANIM_DIR + f, res, undefined, rej));
        if (!bindRest) bindRest = readBind(obj);
        if (!obj.animations.length) continue;
        const name = f.replace(/\.fbx$/i, '');
        clips[name] = retarget(obj, obj.animations[0], name); clipNames.push(name);
      } catch (e) { console.warn('mixamo clip failed', f, e.message); }
    }
  }

  // ---------- the rifle: in the hand for our own clips; for Mixamo clips aimed along right hand -> left hand, or slung ----------
  const rifle = { mesh: null, O: null, mode: 'hand' };
  function setupRifle() {
    const sk = hero.getObjectByName('Marine_rifle'); if (!sk || !sk.isSkinnedMesh) return;
    const handR = hero.getObjectByName('hand_r'), bi = sk.skeleton.bones.indexOf(handR);
    const geo = sk.geometry.clone(); geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(sk.skeleton.boneInverses[bi], sk.bindMatrix));
    geo.deleteAttribute('skinIndex'); geo.deleteAttribute('skinWeight');
    const mat = sk.material.clone(); mat.skinning = false;
    rifle.mesh = new THREE.Mesh(geo, mat); rifle.mesh.castShadow = true; rifle.mesh.matrixAutoUpdate = false;
    sk.visible = false; hero.add(rifle.mesh);
    // the rifle's own frame (origin at the grip, +y to the muzzle, +z up) from markers the build wrote as glTF extras
    const mk = (sk.userData.rifle_markers || (sk.parent && sk.parent.userData.rifle_markers));
    const toHand = new THREE.Matrix4().multiplyMatrices(sk.skeleton.boneInverses[bi], sk.bindMatrix);
    if (mk) {
      const P = [0, 1, 2].map((i) => new THREE.Vector3(mk[i * 3], mk[i * 3 + 2], -mk[i * 3 + 1]).applyMatrix4(toHand)); // Blender z-up -> glTF y-up
      rifle.C = aimFrame(P[0], P[1], P[2].clone().sub(P[0]), true);
      rifle.Cinv = rifle.C.clone().invert();
    }
  }
  function aimFrame(o, target, up) { // +y toward target, +z toward up
    const y = target.clone().sub(o).normalize(), u = (up || new THREE.Vector3(0, 1, 0)).clone();
    const x = new THREE.Vector3().crossVectors(y, u).normalize(), z = new THREE.Vector3().crossVectors(x, y);
    return new THREE.Matrix4().makeBasis(x, y, z).setPosition(o);
  }
  function seatRifle() {
    if (!rifle.mesh) return;
    const name = current ? current.getClip().name : 'Stand';
    const own = name === 'Walk' || name === 'Stand';
    const handR = hero.getObjectByName('hand_r'), handL = hero.getObjectByName('hand_l');
    hero.updateMatrixWorld(true);
    const pr = handR.getWorldPosition(new THREE.Vector3()), pl = handL.getWorldPosition(new THREE.Vector3());
    let W;
    if (own) W = handR.matrixWorld.clone();
    else if (!rifle.Cinv) W = handR.matrixWorld.clone();
    else if (/rifle|grenade/i.test(name) && pr.distanceTo(pl) > 0.12 && pr.distanceTo(pl) < 0.75) {
      // grip just ahead of the right wrist, barrel along the line through the left hand, sights up
      const grip = pr.clone().lerp(pl, 0.12);
      W = aimFrame(grip, pl.clone().addScaledVector(pl.clone().sub(pr).normalize(), 0.3)).multiply(rifle.Cinv);
    }
    else { // slung across the back, muzzle up over the right shoulder
      const sp = hero.getObjectByName('spine_03'); sp.updateMatrixWorld(true);
      const q = sp.getWorldQuaternion(new THREE.Quaternion());
      const back = new THREE.Vector3(0, 0, -0.17).applyQuaternion(q), o = sp.getWorldPosition(new THREE.Vector3()).add(back);
      const dir = new THREE.Vector3(-0.45, 0.85, 0).applyQuaternion(q);
      W = aimFrame(o.clone().addScaledVector(dir, -0.18), o.clone().add(dir), new THREE.Vector3(0, 0, -1).applyQuaternion(q)).multiply(rifle.Cinv);
    }
    rifle.mesh.matrix.copy(new THREE.Matrix4().copy(hero.matrixWorld).invert().multiply(W));
  }

  // ---------- face and breath: procedural, on top of any body clip (never a held preset) ----------
  const MOODS = { calm: { blink: 1.0, brow: 0.0, jaw: 0.04, breath: 4.6, amp: 1.0, look: 0.6 }, alert: { blink: 0.8, brow: 0.35, jaw: 0.0, breath: 3.4, amp: 1.2, look: 1.3 }, strained: { blink: 0.55, brow: -0.45, jaw: 0.14, breath: 2.3, amp: 1.7, look: 0.9 } };
  let mood = MOODS[params.get('mood')] ? params.get('mood') : 'calm';
  const face = { nextBlink: 1.5, blinkAt: -9, second: false, nextLook: 0.8, look: new THREE.Vector2(), head: new THREE.Vector2(), lag: [] };
  const fr = mulberry32(7);
  const wob = (t, a, b, c) => Math.sin(t * a) * 0.5 + Math.sin(t * b + 1.7) * 0.3 + Math.sin(t * c + 4.1) * 0.2;
  function faceLife(fig, t) {
    const M = MOODS[mood];
    if (t >= face.nextBlink) { face.blinkAt = t; if (!face.second && fr() < 0.18) { face.second = true; face.nextBlink = t + 0.34; } else { face.second = false; face.nextBlink = t + (2 + fr() * 5) * M.blink; } }
    const bt = t - face.blinkAt;
    const blink = bt < 0 ? 0 : bt < 0.12 ? Math.pow(bt / 0.12, 1.5) : bt < 0.30 ? 1 - Math.pow((bt - 0.12) / 0.18, 0.8) : 0;
    if (t >= face.nextLook) { face.look.set((fr() - 0.5) * 0.16 * M.look, (fr() - 0.5) * 0.06 * M.look); face.nextLook = t + 1 + fr() * 3; }
    face.lag.push([t, face.look.x, face.look.y]); while (face.lag.length > 2 && face.lag[1][0] <= t - 0.1) face.lag.shift();
    face.head.lerp(new THREE.Vector2(face.lag[0][1], face.lag[0][2]), 0.12);
    const brow = THREE.MathUtils.clamp(M.brow + 0.35 * wob(t, 0.53, 1.37, 2.9), -1, 1);
    const jaw = Math.max(0, M.jaw + 0.06 * wob(t, 0.41, 1.13, 2.3));
    fig.traverse((o) => { if (o.morphTargetDictionary) { const d = o.morphTargetDictionary, inf = o.morphTargetInfluences; if (d.blink !== undefined) inf[d.blink] = blink; if (d.brow !== undefined) inf[d.brow] = brow; if (d.jaw !== undefined) inf[d.jaw] = jaw; } });
    const br = Math.sin(t * TAU / M.breath) * 0.5 + 0.5;
    const hb = fig.getObjectByName('head'), sp = fig.getObjectByName('spine_03'), nk = fig.getObjectByName('neck_01');
    if (sp) sp.rotateX(-0.018 * M.amp * br);
    if (nk) nk.rotateX(0.010 * M.amp * br);
    for (const s of ['clavicle_l', 'clavicle_r']) { const c = fig.getObjectByName(s); if (c) c.rotateZ((s.endsWith('l') ? 1 : -1) * 0.012 * M.amp * br); }
    if (hb) { hb.rotateY(face.head.x); hb.rotateX(face.head.y + 0.02 * wob(t, 0.3, 0.77, 1.9)); }
    return { blink, brow, jaw };
  }

  // ---------- modes and keys ----------
  function setMode(m) {
    MODE = m;
    const pl = m === 'platoon';
    if (platoon) platoon.visible = pl;
    hero.visible = !pl && !LOD; heroLod.visible = !pl && LOD;
    if (m === 'walk') playClip(params.get('clip') && clips[params.get('clip')] ? params.get('clip') : 'Walk');
    else if (m !== 'platoon') playClip(params.get('clip') && clips[params.get('clip')] ? params.get('clip') : 'Stand');
  }
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 't') setMode('turn'); else if (k === 'w') setMode('walk'); else if (k === 'f') setMode('face'); else if (k === 'm') setMode('platoon');
    else if (k === 'l') { LOD = !LOD; setMode(MODE); }
    else if (k === 'e') { const ks = Object.keys(MOODS); mood = ks[(ks.indexOf(mood) + 1) % ks.length]; }
    else if (k === 'c') { const names = clipNames.filter((n) => n !== 'TPose'); playClip(names[(names.indexOf(clipNames[clipIdx]) + 1) % names.length]); }
  });

  // ---------- frame ----------
  let last = performance.now(), frames = 0, fpsT = 0, fps = 0;
  const v3 = new THREE.Vector3(), head = new THREE.Vector3();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const t = now / 1000;
    wind.value = t; vatTime.value = t / (clips.Walk ? clips.Walk.duration : 1);
    if (hero && hero.userData.addRest) for (const fig of [hero, heroLod]) for (const [n, q] of fig.userData.addRest) fig.getObjectByName(n).quaternion.copy(q);
    if (mixer) { mixer.update(dt); mixerLod.update(dt); if (MODE !== 'platoon') window.__face = faceLife(LOD ? heroLod : hero, t); }
    const fig = LOD ? heroLod : hero;
    if (hero) {
      const cc = current && current.getClip();
      const speed = !cc ? 0 : cc.name === 'Walk' ? WALK_SPEED : (cc.userData && cc.userData.speed > 0.3 && /walk|run/i.test(cc.name) ? cc.userData.speed : 0);
      const walking = MODE === 'walk' && speed > 0;
      let x = 0, z = 0, yaw = 0;
      if (MODE === 'walk') { const L = FOLLOW ? 40 : 7; x = walking ? ((speed * t) % L) - L / 2 : 0; yaw = walking ? Math.PI / 2 : 0.35; }
      else if (MODE === 'face') yaw = 0.15;
      for (const h of [hero, heroLod]) { h.position.set(x, groundY(x, z), z); h.rotation.y = yaw; }
      sun.target.position.set(x, 0, z); sun.position.set(x - 7, 6.5, z + 5);
      fig.updateMatrixWorld(true);
      // foot contact for Mixamo clips: the X Bot's legs are not the Marine's, so put the lowest foot back on the ground
      if (cc && cc.userData && cc.userData.mixamo && tposeRef && /walk|run|idle|stand|kneel|crouch|look|point|phone|throw|carry/i.test(cc.name)) {
        let dmin = Infinity;
        for (const bn of ['foot_l', 'foot_r', 'ball_l', 'ball_r']) { const b = fig.getObjectByName(bn); dmin = Math.min(dmin, b.getWorldPosition(v3).y - fig.position.y - tposeRef[bn].p.y); }
        for (const h of [hero, heroLod]) h.position.y -= dmin;
        fig.updateMatrixWorld(true);
      }
      seatRifle();
      if (MODE === 'turn') { const a = ORBIT !== null ? ORBIT : t * 0.35; camera.fov = 32; camera.position.set(Math.sin(a) * 3.6, 1.45, Math.cos(a) * 3.6); camera.lookAt(0, 0.95, 0); }
      else if (MODE === 'walk' && FOLLOW) { const gy = groundY(x, z); camera.fov = 34; camera.position.set(x + 2.4, gy + 1.7, z + 4.6); camera.lookAt(x + 0.4, gy + 0.75, z); }
      else if (MODE === 'walk') { camera.fov = 34; camera.position.set(0, 1.7, 5.6); camera.lookAt(0, 0.75, 0); }
      else if (MODE === 'face') {
        const hb = fig.getObjectByName('head'); hb.getWorldPosition(head); head.y += 0.07;
        // 6 m away (the nearest the scene's cameras get), long lens so the head fills the frame
        const a = 0.25 * Math.sin(t * 0.2) + 0.2; camera.fov = 4.2; camera.position.set(head.x + Math.sin(yaw + a) * 6, head.y + 0.1, head.z + Math.cos(yaw + a) * 6); camera.lookAt(head.x, head.y - 0.06, head.z);
      } else if (MODE === 'platoon') { camera.fov = 40; camera.position.set(-6, 14, 42); camera.lookAt(0, 0, -5); }
      if (PIN) { const gy = groundY(x, z); camera.fov = PIN[6] || 30; camera.position.set(x + PIN[0], gy + PIN[1], z + PIN[2]); camera.lookAt(x + PIN[3], gy + PIN[4], z + PIN[5]); }
      camera.updateProjectionMatrix();
      if (platoon && platoon.visible) updatePlatoon(t);
    }
    renderer.render(scene, camera);
    frames++; fpsT += dt; if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    const ri = renderer.info.render;
    hud.textContent = `${fps} fps · ${ri.triangles.toLocaleString('en-US')} tris · ${ri.calls} draws · ${MODE}${MODE !== 'platoon' ? (LOD ? ' · LOD ' + stats.lod.toLocaleString('en-US') : ' · hero ' + stats.hero.toLocaleString('en-US')) + ' tris · ' + (current ? current.getClip().name : '') + ' · ' + mood : ' · 30 × LOD (vertex-animation instancing)'}`;
  }

  Promise.all([load('marine.glb'), load('marine-lod.glb'), load('marine-lod.glb')]).then(async ([g, gl, gl2]) => {
    hero = g.scene; heroLod = gl.scene; prep(hero); prep(heroLod);
    stats.hero = countTris(hero); stats.lod = countTris(heroLod);
    scene.add(hero, heroLod);
    mixer = new THREE.AnimationMixer(hero); mixerLod = new THREE.AnimationMixer(heroLod);
    for (const c of g.animations) { clips[c.name] = c; clipNames.push(c.name); }
    for (const c of gl2.animations) if (!clips[c.name]) clips[c.name] = c;
    gl2.animations.forEach((c) => { clips[c.name] = clips[c.name] || c; });
    platoon = buildPlatoon(gl2);
    for (const fig of [hero, heroLod]) fig.userData.addRest = ['head', 'neck_01', 'spine_03', 'clavicle_l', 'clavicle_r'].map((n) => [n, fig.getObjectByName(n).quaternion.clone()]);
    setupRifle();
    try { await loadMixamo(); } catch (e) { console.warn(e); }
    setMode(MODE);
    window.__spike = { hero, heroLod, clips, scene, renderer };
    if (params.has('nonormal')) hero.traverse((o) => { if (o.isMesh) { o.material.normalMap = null; o.material.needsUpdate = true; } });
    if (params.has('noao')) hero.traverse((o) => { if (o.isMesh) { o.material.aoMap = null; o.material.metalnessMap = null; o.material.roughnessMap = null; o.material.needsUpdate = true; } });
    window.__ready = true;
  }).catch((e) => { console.error(e); hud.textContent = 'load failed: ' + e.message; window.__ready = true; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
