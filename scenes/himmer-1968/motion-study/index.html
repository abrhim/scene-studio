<!doctype html>
<html lang="en">

<style>

  canvas { display: block; }

  #keys { left: 16px; top: 14px; }

</head>
<body>

<div class="hud lbl src" style="left:24px;display:none">Rifle Walk</div><div class="hud lbl src" style="left:calc(33.33% + 24px);display:none">Walk With Rifle</div><div class="hud lbl src" style="left:calc(66.67% + 24px);display:none">Patrol carry (stand-in)</div>
<div class="src" style="position:fixed;left:33.33%;top:0;bottom:0;width:2px;background:rgba(20,20,20,.6);display:none"></div><div class="src" style="position:fixed;left:66.67%;top:0;bottom:0;width:2px;background:rgba(20,20,20,.6);display:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- cdnjs's r128 has no examples/ folder; these are the same r128 files from jsdelivr -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
// Motion study: a procedural layer over the Mixamo clips that makes the realistic Marine walk less stiff.
// ?view=hero|compare|crowd  ?layers=1234567 (which layers are on; ?layers= for the raw clip)  ?t0=seconds  ?clip=Rifle%20Walk
// Each layer works per figure from a handful of parameters, so the same code runs 150 figures.
(function () {
  'use strict';
  window.__ready = false;
  const params = new URLSearchParams(location.search);
  let VIEW = params.get('view') || 'hero';
  const KEYS = ['rifle', 'kit', 'look', 'load', 'vary', 'trans', 'sway'];
  const NAMES = { rifle: 'two-hand rifle', kit: 'kit', look: 'look', load: 'load', vary: 'variation', trans: 'transitions', sway: 'hip sway' };
  const L = {}; KEYS.forEach((k, i) => { L[k] = !params.has('layers') || params.get('layers').includes(String(i + 1)); });
  const T0 = Number(params.get('t0') || 0);
  const CAMP = params.has('cam') ? params.get('cam').split(',').map(Number) : null; // hero camera: distance, height, look height, fov, lead
  const ANIM = '../realistic-spike/anim/';
  const WALK = params.get('clip') || 'Rifle Walk';
  const IDLE = 'Rifle Idle';
  const TAU = Math.PI * 2;
  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rand = mulberry32(19680416);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const UP = new THREE.Vector3(0, 1, 0), RIGHT = new THREE.Vector3(-1, 0, 0), FWD = new THREE.Vector3(0, 0, 1); // figure space: faces +z, his right is -x

  // ---------- renderer (as template/index.html: sRGB out, ACES, exposure 1.12) ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.autoClear = false;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 900);
  const camera2 = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 900);
  const srcCams = [0, 1, 2].map(() => new THREE.PerspectiveCamera(30, 1, 0.05, 900));
  addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

  const HORIZON = '#efe0bf';
  function skyCanvas(w, h, withGround) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#5d93c9'); gr.addColorStop(0.3, '#a9c9e2'); gr.addColorStop(0.48, HORIZON);
    if (withGround) { gr.addColorStop(0.52, '#8c7a55'); gr.addColorStop(1, '#4e4630'); } else gr.addColorStop(1, HORIZON);
    g.fillStyle = gr; g.fillRect(0, 0, w, h); return c;
  }
  const skyTex = new THREE.CanvasTexture(skyCanvas(4, 512, false)); skyTex.encoding = THREE.sRGBEncoding; scene.background = skyTex;
  const envSrc = new THREE.CanvasTexture(skyCanvas(256, 128, true)); envSrc.encoding = THREE.sRGBEncoding; envSrc.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(envSrc).texture;
  scene.fog = new THREE.FogExp2(new THREE.Color(HORIZON).getHex(), 0.011);
  const hemi = new THREE.HemisphereLight(0xdfe9ff, 0xc9b07a, 0.55);
  const sun = new THREE.DirectionalLight(0xffe0b4, 1.55);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  const fill = new THREE.DirectionalLight(0xfff6ea, 0.25); fill.position.set(6, 3, -4);
  scene.add(hemi, sun, sun.target, fill);
  function aimSun(x, z, r) { sun.target.position.set(x, 0, z); sun.position.set(x - 7, 6.5, z + 5); Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.5, far: 40 }); sun.shadow.camera.updateProjectionMatrix(); }

  // ---------- ground: as the spike (a slope rising to -z, flat along the trail at z = 0), with rough patches on the trail ----------
  const SLOPE = 0.11;
  function n2(x, z) { return Math.sin(x * 0.21 + Math.sin(z * 0.17) * 2) * 0.5 + Math.sin(z * 0.33 - x * 0.12) * 0.35 + Math.sin(x * 0.9 + z * 0.7) * 0.08; }
  function groundY(x, z) { const near = Math.min(1, Math.max(0, (Math.abs(z) - 2.5) / 6)); return -SLOPE * z + n2(x, z) * 0.35 * near + n2(x * 3, z * 3) * 0.03; }
  const ROUGH = [[-4.9, -4.2], [-1.9, -1.0], [4.2, 5.1]]; // x ranges of broken ground on the hero's trail (z = 0)
  {
    const geo = new THREE.PlaneGeometry(260, 260, 160, 160); geo.rotateX(-Math.PI / 2);
    const p = geo.attributes.position, col = new Float32Array(p.count * 3);
    const a = lin(0x7d6a48), b = lin(0x8e8a55), c = new THREE.Color();
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, groundY(x, z)); c.copy(a).lerp(b, 0.5 + 0.5 * Math.sin(x * 0.3 + z * 0.4) * Math.cos(z * 0.21)); col.set([c.r, c.g, c.b], i * 3); }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
    const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
    g.fillStyle = '#b0a080'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2600; i++) { const v = 120 + rand() * 90; g.fillStyle = `rgba(${v | 0},${(v * 0.9) | 0},${(v * 0.62) | 0},0.5)`; g.fillRect(rand() * 256, rand() * 256, 1 + rand() * 3, 1 + rand() * 2); }
    for (let i = 0; i < 500; i++) { g.strokeStyle = `rgba(${150 + rand() * 60 | 0},${140 + rand() * 50 | 0},${70 + rand() * 30 | 0},0.6)`; g.beginPath(); const x = rand() * 256, y = rand() * 256; g.moveTo(x, y); g.lineTo(x + (rand() - 0.5) * 14, y + (rand() - 0.5) * 14); g.stroke(); }
    const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(90, 90); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: t, vertexColors: true, roughness: 0.95 }));
    ground.receiveShadow = true; scene.add(ground);
    // stones and clods on the rough patches, kept mostly off the foot line
    const rg = new THREE.IcosahedronGeometry(1, 0); const rm = new THREE.MeshStandardMaterial({ color: lin(0x5c5242), roughness: 0.95, flatShading: true });
    const rocks = []; for (const [x0, x1] of ROUGH) for (let i = 0; i < 46; i++) { const x = x0 + rand() * (x1 - x0), side = rand() < 0.5 ? -1 : 1, z = rand() < 0.25 ? (rand() - 0.5) * 0.3 : side * (0.2 + rand() * 0.9), s = rand() < 0.2 && Math.abs(z) > 0.25 ? 0.05 + rand() * 0.05 : 0.015 + rand() * 0.025; rocks.push([x, z, s]); }
    const ri = new THREE.InstancedMesh(rg, rm, rocks.length), m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    rocks.forEach(([x, z, s], i) => { e.set(rand() * 3, rand() * 3, rand() * 3); q.setFromEuler(e); m.compose(new THREE.Vector3(x, groundY(x, z) + s * 0.25, z), q, new THREE.Vector3(s * (1 + rand() * 0.6), s * 0.55, s)); ri.setMatrixAt(i, m); });
    ri.castShadow = ri.receiveShadow = true; scene.add(ri);
  }

  // ---------- grass: the spike's elephant grass behind the clearing, and short tufts on the trail ----------
  const wind = { value: 0 };
  function bladeTexture(n, short) {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 512; const g = cv.getContext('2d');
    for (let i = 0; i < n; i++) {
      const x = 8 + rand() * 240, top = 10 + rand() * (short ? 300 : 120), w = 3 + rand() * 4, lean = (rand() - 0.5) * 60;
      const k = rand(); const r = 120 + k * 80, gg = 125 + k * 50, bb = 55 + k * 25;
      const grd = g.createLinearGradient(0, 512, 0, top); grd.addColorStop(0, `rgb(${r * 0.55 | 0},${gg * 0.6 | 0},${bb * 0.5 | 0})`); grd.addColorStop(0.6, `rgb(${r * 0.85 | 0},${gg | 0},${bb | 0})`); grd.addColorStop(1, `rgb(${r + 40 | 0},${gg + 30 | 0},${bb + 20 | 0})`);
      g.fillStyle = grd; g.beginPath(); g.moveTo(x - w, 512); g.quadraticCurveTo(x - w * 0.6 + lean * 0.3, (512 + top) / 2, x + lean, top); g.quadraticCurveTo(x + w * 0.6 + lean * 0.3, (512 + top) / 2, x + w, 512); g.fill();
    }
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding; return tex;
  }
  function clumpGeo(W, H0, H1) {
    const pos = [], uv = [], idx = [];
    for (let q = 0; q < 4; q++) {
      const ang = q * Math.PI / 4 + rand() * 0.3, cx = Math.cos(ang), sz = Math.sin(ang), H = H0 + rand() * (H1 - H0), bend = (0.25 + rand() * 0.3) * H / 2, base = pos.length / 3;
      for (let j = 0; j <= 4; j++) { const t = j / 4, y = H * t, off = bend * t * t; for (const s of [-1, 1]) { pos.push(cx * W * s + sz * off, y, sz * W * s - cx * off); uv.push((s + 1) / 2, t); } }
      for (let j = 0; j < 4; j++) { const a = base + j * 2; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.setIndex(idx); geo.computeVertexNormals(); return geo;
  }
  function grassMat(tex, sway) {
    const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.85 });
    mat.onBeforeCompile = (sh) => { sh.uniforms.uWind = wind; sh.vertexShader = 'uniform float uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wp = instanceMatrix * vec4(0.,0.,0.,1.); float h2 = position.y * position.y * ${sway.toFixed(3)};
      transformed.x += h2 * 0.12 * sin(uWind * 1.3 + wp.x * 0.35 + wp.z * 0.2); transformed.z += h2 * 0.08 * sin(uWind * 1.7 + wp.z * 0.4);`); };
    return mat;
  }
  function scatter(geo, mat, n, tries, ok, sMin, sMax) {
    const spots = []; for (let i = 0; i < tries && spots.length < n; i++) { const x = (rand() - 0.5) * 150, z = (rand() - 0.5) * 120 - 10; if (ok(x, z)) spots.push([x, z]); }
    const inst = new THREE.InstancedMesh(geo, mat, spots.length), m = new THREE.Matrix4(), q4 = new THREE.Quaternion(), s3 = new THREE.Vector3();
    spots.forEach(([x, z], i) => { q4.setFromAxisAngle(UP, rand() * TAU); const s = sMin + rand() * (sMax - sMin); s3.set(s, s * (0.85 + rand() * 0.3), s); m.compose(new THREE.Vector3(x, groundY(x, z) - 0.03, z), q4, s3); inst.setMatrixAt(i, m); });
    inst.receiveShadow = true; scene.add(inst); return inst;
  }
  scatter(clumpGeo(0.75, 2.0, 2.4), grassMat(bladeTexture(46, false), 0.25), 5200, 30000, (x, z) => {
    const patch = Math.sin(x * 0.13 + 1.3) * Math.sin(z * 0.11 + 0.4) + Math.sin(x * 0.05 - z * 0.07) * 0.6;
    return patch > 0.0 && !(z > -6.5 && z < 18 && Math.abs(x) < 45);
  }, 0.8, 1.2);
  scatter(clumpGeo(0.22, 0.25, 0.5), grassMat(bladeTexture(60, true), 1.6), 9000, 40000, (x, z) => z > -6.5 && z < 12 && Math.abs(x) < 45 && Math.abs(z) > 0.28 && Math.sin(x * 1.7) * Math.sin(z * 2.3) + Math.sin(x * 0.4 + z) > -0.2, 0.5, 1.0);

  // ---------- loading ----------
  const gltfLoader = new THREE.GLTFLoader();
  const loadGltf = (u) => new Promise((res, rej) => gltfLoader.load(u, res, undefined, rej));
  const fbxLoader = new THREE.FBXLoader();
  const loadFbx = (u) => new Promise((res, rej) => fbxLoader.load(u, res, undefined, rej));
  const clips = {};

  // ---------- Mixamo retarget (from realistic-spike/index.html), with one change: the hips' sway is kept ----------
  // The spike strips the hips' horizontal motion entirely (hp.x, hp.z = rest), which also throws away the side-to-side weight
  // shift and the surge of each step. Here only the straight-line drift is removed; the residual is stored per clip
  // (userData.sway) and the sway layer adds it back, weighted by each playing action.
  const MIX = { Hips: 'pelvis', Spine: 'spine_01', Spine1: 'spine_02', Spine2: 'spine_03', Neck: 'neck_01', Head: 'head' };
  for (const [S, s] of [['Left', 'l'], ['Right', 'r']]) {
    Object.assign(MIX, { [S + 'Shoulder']: 'clavicle_' + s, [S + 'Arm']: 'upperarm_' + s, [S + 'ForeArm']: 'lowerarm_' + s, [S + 'Hand']: 'hand_' + s, [S + 'UpLeg']: 'thigh_' + s, [S + 'Leg']: 'calf_' + s, [S + 'Foot']: 'foot_' + s, [S + 'ToeBase']: 'ball_' + s });
    for (const [F, f] of [['Thumb', 'thumb'], ['Index', 'index'], ['Middle', 'middle'], ['Ring', 'ring'], ['Pinky', 'pinky']]) for (let k = 1; k <= 3; k++) MIX[S + 'Hand' + F + k] = f + '_0' + k + '_' + s;
  }
  const MIXR = {}; for (const k in MIX) MIXR[MIX[k]] = k;
  const mixKey = (n) => n.replace(/^mixamorig\d*[:_]?/i, '');
  let tposeRef = null, bindRest = null;
  function captureTpose(root, clip) {
    const m = new THREE.AnimationMixer(root); m.clipAction(clip).play(); m.setTime(0); root.updateMatrixWorld(true);
    tposeRef = {}; root.traverse((o) => { if (o.isBone) tposeRef[o.name] = { q: o.getWorldQuaternion(new THREE.Quaternion()), p: o.getWorldPosition(new THREE.Vector3()) }; });
    m.stopAllAction(); m.uncacheRoot(root);
  }
  function readBind(obj) {
    let sk = null; obj.traverse((o) => { if (o.isSkinnedMesh && !sk) sk = o; }); if (!sk) return null;
    const r = {}, q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
    sk.skeleton.bones.forEach((b, i) => { new THREE.Matrix4().copy(sk.skeleton.boneInverses[i]).invert().decompose(p, q, sc); r[mixKey(b.name)] = { q: q.clone(), p: p.clone() }; });
    return r;
  }
  function relTo(root, bone, q, p) {
    const rq = root.getWorldQuaternion(new THREE.Quaternion()).invert();
    if (q) bone.getWorldQuaternion(q).premultiply(rq);
    if (p) { bone.getWorldPosition(p); p.applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert()); }
  }
  function retarget(src, clip, name, tgt) {
    const bones = {}; src.traverse((o) => { if (o.isBone || o.type === 'Bone' || MIX[mixKey(o.name)]) bones[mixKey(o.name)] = o; });
    src.updateMatrixWorld(true);
    const rest = {};
    for (const k in bones) { if (bindRest && bindRest[k]) rest[k] = bindRest[k]; else { const q = new THREE.Quaternion(), p = new THREE.Vector3(); relTo(src, bones[k], q, p); rest[k] = { q, p }; } }
    const tb = {}; tgt.traverse((o) => { if (o.isBone) tb[o.name] = o; });
    const pairs = Object.keys(MIX).filter((k) => bones[k] && tb[MIX[k]]);
    const hipScale = tposeRef.pelvis.p.y / Math.max(1e-6, rest.Hips.p.y);
    const m = new THREE.AnimationMixer(src); m.clipAction(clip).play();
    const fps = 30, n = Math.max(2, Math.round(clip.duration * fps) + 1), times = new Float32Array(n);
    const hipAt = (t) => { m.setTime(t); src.updateMatrixWorld(true); const p = new THREE.Vector3(); relTo(src, bones.Hips, null, p); return p; };
    const h0 = hipAt(0), h1 = hipAt(clip.duration * 0.999);
    const speed = Math.hypot(h1.x - h0.x, h1.z - h0.z) * hipScale / Math.max(0.1, clip.duration);
    const qv = {}; pairs.forEach((k) => { qv[k] = new Float32Array(n * 4); });
    const order = []; (function walk(o) { if (o.isBone) order.push(o.name); o.children.forEach(walk); })(tgt);
    const inv = {}; const qs = new THREE.Quaternion(), qt = new THREE.Quaternion();
    const hw = [];
    for (let i = 0; i < n; i++) {
      const t = Math.min(clip.duration, i / fps); times[i] = t; m.setTime(t); src.updateMatrixWorld(true);
      const world = {};
      for (const tn of order) {
        const k = MIXR[tn] && bones[MIXR[tn]] ? MIXR[tn] : null;
        if (k) { relTo(src, bones[k], qs, null); qt.copy(qs).multiply(inv[k] || (inv[k] = rest[k].q.clone().invert())).multiply(tposeRef[tn].q); world[tn] = qt.clone(); }
        else world[tn] = tposeRef[tn] ? tposeRef[tn].q.clone() : new THREE.Quaternion();
        const par = tb[tn].parent; const pq = par && par.isBone ? world[par.name] : par.getWorldQuaternion(new THREE.Quaternion());
        if (k) pq.clone().invert().multiply(world[tn]).toArray(qv[k], i * 4);
      }
      const hpos = new THREE.Vector3(); relTo(src, bones.Hips, null, hpos);
      hw.push(hpos.sub(rest.Hips.p).multiplyScalar(hipScale).add(tposeRef.pelvis.p));
    }
    // residual horizontal hip motion: minus the straight line from the first to the last frame, minus its mean
    // Mixamo's last frame repeats the first (the loop closes), so the drift is measured up to the frame before it
    const e = hw[n - 1].distanceTo(hw[0]) < hw[n - 2].distanceTo(hw[0]) * 0.5 ? n - 2 : n - 1;
    const dx = (hw[e].x - hw[0].x) / times[e], dz = (hw[e].z - hw[0].z) / times[e], res = [];
    for (let i = 0; i < n; i++) { const j = i > e ? 0 : i; res.push([hw[j].x - hw[0].x - dx * times[j], hw[j].z - hw[0].z - dz * times[j]]); }
    const mx = res.reduce((s, r) => s + r[0], 0) / n, mz = res.reduce((s, r) => s + r[1], 0) / n;
    const par = tb.pelvis.parent; par.updateMatrixWorld(true); const pinv = new THREE.Matrix4().copy(par.matrixWorld).invert();
    const pv = new Float32Array(n * 3), sway = new Float32Array(n * 3), o0 = tposeRef.pelvis.p.clone().applyMatrix4(pinv);
    for (let i = 0; i < n; i++) {
      new THREE.Vector3(tposeRef.pelvis.p.x, hw[i].y, tposeRef.pelvis.p.z).applyMatrix4(pinv).toArray(pv, i * 3); // root motion stripped, as the spike
      new THREE.Vector3(tposeRef.pelvis.p.x + res[i][0] - mx, tposeRef.pelvis.p.y, tposeRef.pelvis.p.z + res[i][1] - mz).applyMatrix4(pinv).sub(o0).toArray(sway, i * 3);
    }
    const tracks = pairs.map((k) => new THREE.QuaternionKeyframeTrack(MIX[k] + '.quaternion', times, qv[k]));
    tracks.push(new THREE.VectorKeyframeTrack('pelvis.position', times, pv));
    const out = new THREE.AnimationClip(name, clip.duration, tracks);
    const swayAmp = Math.max(...res.map((r) => Math.abs(r[0] - mx))), surgeAmp = Math.max(...res.map((r) => Math.abs(r[1] - mz)));
    out.userData = { speed, mixamo: true, sway, n, fps, swayAmp, surgeAmp };

    if (VIEW === 'sources') document.getElementById('lblL').textContent = '';
    cam.x = null;
  }
  function activeFigs() { return VIEW === 'hero' ? [hero] : VIEW === 'compare' ? [rawFig, layFig] : VIEW === 'sources' ? srcFigs : crowd; }
  function layerText() { return KEYS.map((k, i) => `${i + 1} ${NAMES[k]} ${L[k] ? 'on' : 'off'}`).join(' · '); }
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    const i = '1234567'.indexOf(k); if (i >= 0) L[KEYS[i]] = !L[KEYS[i]];
    else if (k === '0') KEYS.forEach((kk) => { L[kk] = false; }); else if (k === 'a') KEYS.forEach((kk) => { L[kk] = true; });
    else if (k === 'h') setView('hero'); else if (k === 'v') setView('compare'); else if (k === 'c') setView('crowd'); else if (k === 's') setView('sources');
  });

  let simT = 0; const cost = { ms: 0, n: 0, avg: 0 };
  function step(dt) {
    simT += dt; wind.value = simT;
    const active = activeFigs();
    if (VIEW === 'hero') hero.want = heroScript(simT);
    const t0 = performance.now();
    for (const f of active) updateFigure(f, dt, simT);
    cost.ms += performance.now() - t0; cost.n++;
  }
  function placeCameras() {
    if (VIEW === 'hero') {
      if (cam.x === null || CAMP) cam.x = hero.x; cam.x += (hero.x - cam.x) * 0.12;
      const gy = groundY(cam.x, 0); camera.aspect = innerWidth / innerHeight;
      const CC = CAMP || [6.0, 1.62, 0.95, 28, 2.4]; camera.fov = CC[3]; camera.position.set(cam.x + CC[4], gy + CC[1], CC[0]); camera.lookAt(cam.x + 0.25, gy + CC[2], 0);
      aimSun(hero.x, 0, 3);
    } else if (VIEW === 'compare') {
      if (cam.x === null) cam.x = rawFig.x;
      for (const [c, f] of [[camera, rawFig], [camera2, layFig]]) { const gy = groundY(f.x, 0); c.fov = 30; c.aspect = (innerWidth / 2) / innerHeight; c.position.set(f.x + 1.5, gy + 1.62, 4.3); c.lookAt(f.x + 0.1, gy + 0.95, 0); c.updateProjectionMatrix(); }
      aimSun(layFig.x, 0, 3);
    } else if (VIEW === 'sources') {
      srcFigs.forEach((f, i) => { const c = srcCams[i], gy = groundY(f.x, 0); c.fov = 30; c.aspect = (innerWidth / 3) / innerHeight; c.position.set(f.x + 1.6, gy + 1.62, 5.2); c.lookAt(f.x + 0.1, gy + 0.92, 0); c.updateProjectionMatrix(); });
      aimSun(srcFigs[1].x, 0, 4);
    } else {
      const mx = crowd.reduce((s, f) => s + f.x, 0) / crowd.length;
      if (cam.x === null) cam.x = mx; cam.x += (mx - cam.x) * 0.05;
      camera.fov = 36; camera.aspect = innerWidth / innerHeight; camera.position.set(cam.x + 7, 3.4, 15); camera.lookAt(cam.x + 0.5, 0.6, -0.3);
      aimSun(cam.x, 0, 13);
    }
    camera.updateProjectionMatrix();
  }
  function render() {
    const W = innerWidth, H = innerHeight;
    renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.clear();
    if (VIEW === 'compare') {
      renderer.setScissorTest(true);
      rawFig.root.visible = true; layFig.root.visible = false; renderer.setViewport(0, 0, W / 2, H); renderer.setScissor(0, 0, W / 2, H); renderer.render(scene, camera);
      rawFig.root.visible = false; layFig.root.visible = true; renderer.setViewport(W / 2, 0, W / 2, H); renderer.setScissor(W / 2, 0, W / 2, H); renderer.render(scene, camera2);
      rawFig.root.visible = true; renderer.setScissorTest(false);
    } else if (VIEW === 'sources') {
      renderer.setScissorTest(true);
      srcFigs.forEach((f, i) => { srcFigs.forEach((g, j) => { g.root.visible = i === j; }); const x = Math.round(W * i / 3), w = Math.round(W * (i + 1) / 3) - x; renderer.setViewport(x, 0, w, H); renderer.setScissor(x, 0, w, H); renderer.render(scene, srcCams[i]); });
      srcFigs.forEach((g) => { g.root.visible = true; }); renderer.setScissorTest(false);
    } else renderer.render(scene, camera);
  }

  const hud = document.getElementById('fps'), lay = document.getElementById('layers');
  let last = null, frames = 0, fpsT = 0, fps = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!hero) return;
    if (last === null) last = now;
    const dt = Math.min(0.1, Math.max(0.001, (now - last) / 1000)); last = now;
    step(dt); placeCameras(); render();
    frames++; fpsT += dt; if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; cost.avg = cost.ms / Math.max(1, cost.n); cost.ms = 0; cost.n = 0; }
    const ri = renderer.info.render;
    hud.textContent = `${fps} fps · ${ri.triangles.toLocaleString('en-US')} tris · ${ri.calls} draws · motion ${cost.avg.toFixed(2)} ms · ${VIEW}`;
    lay.textContent = layerText();
  }

  // ---------- start ----------
  Promise.all([loadGltf('marine.glb'), loadGltf('marine-lod.glb'), loadFbx(ANIM + encodeURIComponent('Rifle Walk') + '.fbx'), loadFbx(ANIM + encodeURIComponent(IDLE) + '.fbx'),
    loadFbx(ANIM + encodeURIComponent('Walk With Rifle') + '.fbx')]).then(([gH, gL, fWalk, fIdle, fAlt]) => {
    const tH = gH.scene, tL = gL.scene;
    captureTpose(tH, gH.animations.find((a) => a.name === 'TPose'));
    bindRest = readBind(fWalk);
    clips['Rifle Walk'] = retarget(fWalk, fWalk.animations[0], 'Rifle Walk', tH);
    clips[IDLE] = retarget(fIdle, fIdle.animations[0], IDLE, tH);
    clips['Walk With Rifle'] = retarget(fAlt, fAlt.animations[0], 'Walk With Rifle', tH);
    clips[IDLE].userData.turn = handHeading(tH, clips[WALK]) - handHeading(tH, clips[IDLE]); turnClip(tH, clips[IDLE], clips[IDLE].userData.turn);
    const WALKS = ['Rifle Walk', 'Walk With Rifle'];
    for (const w of WALKS) MEANS[w] = clipMeans(clips[w]);
    setupRifleFrame(tH);
    INFO.hero = analyse(tH, true); rigFigure(tH, INFO.hero);
    INFO.lod = analyse(tL, false); rigFigure(tL, INFO.lod);
    for (const w of WALKS) GRIP[w] = computeGrip(tH, clips[w], 0, clips[w].duration);
    GRIP.idle = computeGrip(tH, clips[IDLE], 0.5, Math.min(clips[IDLE].duration, 4.0));
    for (const w of WALKS) STOP[w] = stopPhase(tH, clips[w], clips[IDLE], IDLE_T);
    hero = makeFigure(tH, INFO.hero, { seed: 11, hero: true, x: -7.5, vary: false });
    rawFig = makeFigure(tH, INFO.hero, { seed: 12, raw: true, x: -4 });
    layFig = makeFigure(tH, INFO.hero, { seed: 11, hero: true, x: -4 });
    srcFigs.push(makeFigure(tH, INFO.hero, { seed: 11, hero: true, x: -4, walk: 'Rifle Walk' }), makeFigure(tH, INFO.hero, { seed: 11, hero: true, x: -4, walk: 'Walk With Rifle' }), makeFigure(tH, INFO.hero, { seed: 11, hero: true, x: -4, walk: 'Walk With Rifle', carry: true }));
    const rr = mulberry32(5);
    for (let i = 0; i < 30; i++) { const row = Math.floor(i / 5), col = i % 5; crowd.push(makeFigure(tL, INFO.lod, { seed: 100 + i * 13, vary: true, x: -row * 3.0 + (rr() - 0.5) * 1.2 - 2, z: (col - 2) * 1.75 + (rr() - 0.5) * 0.5 })); }
    window.__study = { rifleC: rifle.C, markerDist: rifle.len, clips, INFO, GRIP, STOP, figures, hero, crowd, L, cost, scene, renderer, stats: () => ({ walk: clips[WALK].userData, idle: clips[IDLE].userData, dur: [clips[WALK].duration, clips[IDLE].duration] }) };
    setView(VIEW);
    if (T0 > 0) { const n = Math.round(T0 * 30); for (let i = 0; i < n; i++) step(1 / 30); }
    window.__ready = true;
  }).catch((e) => { console.error(e); hud.textContent = 'load failed: ' + e.message; window.__ready = true; });
  requestAnimationFrame(frame);
})();
</script>
</body>
