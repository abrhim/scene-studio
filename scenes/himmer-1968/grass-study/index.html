<style>

<body>
<div id="keys" class="hud">1 blade clumps · 2 crossed cards · 3 hybrid · Q 6 m · W 40 m · E 150 m · N dusk · drag to orbit, wheel to zoom</div>
<div id="caption" class="hud"></div>
<div id="fps" class="hud">-- fps</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- cdnjs's r128 has no examples/ folder; the same r128 loader from jsdelivr -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// Elephant-grass study for the Himmer 1968 diorama. Three treatments on one 120 x 120 m patch of the 610 m summit
// (DEM at 1/3 scale, relief x1.3), with a thinner skirt of the same grass out to 120 m so the wide view has ground.
//   A  instanced tussocks of 12-20 curved, tapered, twisted 3D blades plus culms and plumes (no alpha)
//   B  three crossed cards per clump with a procedural painted blade atlas (alpha to coverage), plus 3D plume stems
//   C  A within 25 m, B beyond, dithered crossfade 21-29 m, trampled lanes and three bare crater bowls
// ?g=A|B|C  ?time=day|dusk  ?cam=near|mid|wide|x,y,z,tx,ty,tz  ?t0=seconds  ?bench=1  ?res=native|<ratio>
(async function () {
  'use strict';
  window.__ready = false;
  const P = new URLSearchParams(location.search);
  let MODE = (P.get('g') || 'C').toUpperCase(); if (!'ABC'.includes(MODE)) MODE = 'C';
  let DUSK = P.get('time') === 'dusk';
  const T0 = Number(P.get('t0') || 0);
  const TAU = Math.PI * 2;
  const lin = (h) => new THREE.Color(h).convertSRGBToLinear();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash2(ix, iz) { let h = Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
  function vnoise(x, z) { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz); const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function fbm(x, z) { return vnoise(x, z) * 0.55 + vnoise(x * 2.07 + 5.2, z * 2.07 - 1.3) * 0.3 + vnoise(x * 4.3 - 2.7, z * 4.3 + 7.1) * 0.15; }

  // ---------- renderer: sRGB out, ACES (docs/STYLE.md); about 1080p by default ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  const resP = P.get('res');
  renderer.setPixelRatio(resP === 'native' ? devicePixelRatio : resP ? Number(resP) : Math.min(devicePixelRatio, Math.max(1, 1920 / innerWidth)));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.15, 1600);
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); camDirty = true; });

  // ---------- light: 1430 on 16 Apr 1968 at UTC+8 (research §8): sun 66° up, azimuth 258°; dusk: 7° up, az 280° ----------
  const sunDirOf = (elev, az) => { const e = elev * Math.PI / 180, a = az * Math.PI / 180; return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)).normalize(); };
  const LIGHT = {
    day: { sun: sunDirOf(66, 258), sunCol: '#fff0d2', sunI: 1.3, sky: '#dfe9ff', gnd: '#c9b07a', hemiI: 0.42, zen: '#6f9ec6', hor: '#cfd9d8', fog: '#c9d1cc', fogD: 0.0021, exp: 1.1, fill: 0.22 },
    dusk: { sun: sunDirOf(7, 280), sunCol: '#ffae66', sunI: 1.7, sky: '#7d86b4', gnd: '#7a5634', hemiI: 0.32, zen: '#4a4f7a', hor: '#e2a35a', fog: '#b98d6c', fogD: 0.0026, exp: 1.15, fill: 0.08 },
  };
  const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.6);
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 60 });
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  const fill = new THREE.DirectionalLight(0xfff6ea, 0.2);
  scene.add(hemi, sun, sun.target, fill);
  scene.fog = new THREE.FogExp2(0xffffff, 0.004);
  const pmrem = new THREE.PMREMGenerator(renderer);
  function skyCanvas(w, h, L, ground) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, L.zen); gr.addColorStop(ground ? 0.5 : 1, L.hor);
    if (ground) { gr.addColorStop(0.52, '#8c7a55'); gr.addColorStop(1, '#4e4630'); }
    g.fillStyle = gr; g.fillRect(0, 0, w, h); return c;
  }
  const U = { // uniforms shared by every grass and ground material
    uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uLanes: { value: 0 }, uSunDir: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Color() },
    uCBase: { value: lin('#56622e') }, uCBody: { value: lin('#8d8a46') }, uCTop: { value: lin('#b9a95c') }, uCTip: { value: lin('#d2c38a') },
    uCDead0: { value: lin('#857a5c') }, uCDead1: { value: lin('#b3a682') }, uCPlume: { value: lin('#d4cbb2') },
  };
  let envTex = null; const FIGMATS = [];
  function applyLight() {
    const L = DUSK ? LIGHT.dusk : LIGHT.day;
    hemi.color.set(L.sky); hemi.groundColor.set(L.gnd); hemi.intensity = L.hemiI;
    sun.color.set(L.sunCol); sun.intensity = L.sunI; fill.intensity = 0; fill.visible = false; hemi.intensity = L.hemiI + L.fill;
    U.uSunDir.value.copy(L.sun); U.uSunCol.value.set(L.sunCol).convertSRGBToLinear().multiplyScalar(L.sunI);
    scene.fog.color.set(L.fog); scene.fog.density = L.fogD;
    renderer.toneMappingExposure = L.exp;
    const bg = new THREE.CanvasTexture(skyCanvas(4, 512, L, false)); bg.encoding = THREE.sRGBEncoding; scene.background = bg;
    const env = new THREE.CanvasTexture(skyCanvas(128, 64, L, true)); env.encoding = THREE.sRGBEncoding; env.mapping = THREE.EquirectangularReflectionMapping;
    if (envTex) envTex.dispose(); envTex = pmrem.fromEquirectangular(env).texture; scene.environment = null; // grass and ground take ambient from the hemisphere light only (cheaper)
    for (const m of FIGMATS) { m.envMap = envTex; m.needsUpdate = true; }
    fill.position.copy(L.sun).multiplyScalar(-1).setY(0.4);
  }
  applyLight();

  // ---------- land: Copernicus DEM around the 610 m summit, 1/3 scale, relief x1.3 (DESIGN.md §2) ----------
  const LAND = { scale: 1 / 3, vx: 1.3, px0: 284, py0: 298, mx: 29.63, my: 30.71, top: 610 };
  let dem = null;
  try { dem = await (await fetch('../sources/dem-grid.json')).json(); } catch (e) { console.warn('no DEM, using a simple slope'); }
  const demAt = (ix, iy) => dem.data[clamp(iy, 0, dem.height - 1) * dem.width + clamp(ix, 0, dem.width - 1)];
  const cub = (p0, p1, p2, p3, t) => p1 + 0.5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
  function demY(x, z) {
    if (!dem) return -0.18 * z - 0.05 * x;
    const px = LAND.px0 + x / LAND.scale / LAND.mx, py = LAND.py0 + z / LAND.scale / LAND.my; // north = -z, rows run south
    const ix = Math.floor(px), iy = Math.floor(py), fx = px - ix, fy = py - iy, r = [];
    for (let j = -1; j <= 2; j++) r.push(cub(demAt(ix - 1, iy + j), demAt(ix, iy + j), demAt(ix + 1, iy + j), demAt(ix + 2, iy + j), fx));
    return (cub(r[0], r[1], r[2], r[3], fy) - LAND.top) * LAND.scale * LAND.vx;
  }
  // three B-52 crater bowls at true size (DESIGN.md: craters stay human scale); grass thins to nothing on their floors
  const CRATERS = [{ x: -17, z: -6, r: 6.5, d: 2.2 }, { x: 22, z: -21, r: 5.2, d: 1.8 }, { x: 13, z: 23, r: 7.5, d: 2.6 }];
  function craterDy(x, z) {
    let dy = 0;
    for (const c of CRATERS) {
      const q = Math.hypot(x - c.x, z - c.z) / c.r;
      if (q < 1) dy -= c.d * Math.pow(1 - q * q, 1.5);
      dy += c.d * 0.22 * Math.exp(-Math.pow((q - 1.05) / 0.3, 2));
    }
    return dy;
  }
  const micro = (x, z) => (fbm(x * 0.09, z * 0.09) - 0.5) * 0.9 + (vnoise(x * 0.7, z * 0.7) - 0.5) * 0.12;
  const groundY = (x, z) => demY(x, z) + craterDy(x, z) + micro(x, z);
  function craterQ(x, z) { let q = 9; for (const c of CRATERS) q = Math.min(q, Math.hypot(x - c.x, z - c.z) / c.r); return q; }

  // ---------- where things stand ----------
  const F = new THREE.Vector3(3, 0, 8); F.y = groundY(F.x, F.z);           // the 1.78 m capsule
  const MAR = new THREE.Vector3(4.3, 0, 7.4); MAR.y = groundY(MAR.x, MAR.z); // the Marine
  const NEARCAM = new THREE.Vector3(F.x + 2.0, 0, F.z + 5.65);
  // trampled lanes (C only): where men pushed through
  const LANES = [
    [[5.6, 15.5], [4.6, 11.5], [3.4, 7.2], [1.5, 0], [-2.5, -9], [-8, -19], [-14, -32], [-18, -48], [-24, -62]],
    [[-62, 22], [-40, 12], [-26, 2], [-17, -6], [-6, -14], [8, -20], [22, -21], [40, -27], [62, -36]],
  ];
  function laneInfo(x, z) {
    let best = 1e9, ang = 0;
    for (const L of LANES) for (let i = 0; i < L.length - 1; i++) {
      const [ax, az] = L[i], [bx, bz] = L[i + 1], dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz;
      const t = clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1), px = ax + dx * t - x, pz = az + dz * t - z, d = Math.hypot(px, pz);
      if (d < best) { best = d; ang = Math.atan2(dz, dx); }
    }
    return { d: best + (vnoise(x * 0.4, z * 0.4) - 0.5) * 0.5, ang };
  }
  function segDist(x, z, a, b) { const dx = b.x - a.x, dz = b.z - a.z, t = clamp(((x - a.x) * dx + (z - a.z) * dz) / (dx * dx + dz * dz), 0, 1); return Math.hypot(a.x + dx * t - x, a.z + dz * t - z); }

  // grass cover 0..1 (shared by every treatment)
  const FIELD = 120, PATCH = 60;
  function cover(x, z) {
    const q = craterQ(x, z);
    let c = smooth(0.72, 1.18, q);                       // nothing on crater floors, thin on the walls
    c *= 1 - 0.25 * Math.exp(-Math.pow((q - 1.1) / 0.25, 2)); // ejecta rims a little thinner
    c *= 0.72 + 0.4 * fbm(x * 0.06 + 3, z * 0.06 - 2);    // patchiness
    return clamp(c, 0, 1);
  }

  // ---------- ground: a fine mesh over the patch and a coarse one to the haze ----------
  const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.97, metalness: 0, envMapIntensity: 0.4 });
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d'), r = mulberry32(5);
    g.fillStyle = '#a89a86'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 3000; i++) { const v = 110 + r() * 110; g.fillStyle = `rgba(${v | 0},${(v * 0.88) | 0},${(v * 0.74) | 0},0.55)`; g.fillRect(r() * 256, r() * 256, 1 + r() * 3, 1 + r() * 2); }
    for (let i = 0; i < 1400; i++) { const v = 150 + r() * 80; g.strokeStyle = `rgba(${v | 0},${(v * 0.9) | 0},${(v * 0.62) | 0},${0.35 + r() * 0.4})`; g.lineWidth = 1 + r() * 1.5; g.beginPath(); const x = r() * 256, y = r() * 256, a = r() * TAU, l = 8 + r() * 30; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    for (let i = 0; i < 700; i++) { g.strokeStyle = `rgba(${170 + r() * 50 | 0},${150 + r() * 40 | 0},${100 + r() * 30 | 0},0.5)`; g.lineWidth = 1; g.beginPath(); const x = r() * 256, y = r() * 256; g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 16, y + (r() - 0.5) * 16); g.stroke(); }
    const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    groundMat.map = t;
  }
  const C_LITTER = lin('#4b4231'), C_LITTER2 = lin('#5f5438'), C_LAT = lin('#94553a'), C_DUST = lin('#a87a5a'), C_FAR = lin('#6a6442');
  function groundColor(x, z, out) {
    out.copy(C_LITTER).lerp(C_LITTER2, fbm(x * 0.15, z * 0.15));
    const q = craterQ(x, z);
    const bare = 1 - smooth(0.8, 1.25, q);
    if (bare > 0) { const lat = C_LAT.clone().lerp(C_DUST, smooth(0.45, 1.0, q) * 0.7 + (vnoise(x * 1.3, z * 1.3) - 0.5) * 0.3); out.lerp(lat, bare); }
    const outside = smooth(FIELD - 8, FIELD + 4, Math.max(Math.abs(x), Math.abs(z)));
    if (outside > 0) out.lerp(C_FAR.clone().multiplyScalar(0.7 + 0.6 * fbm(x * 0.02, z * 0.02)), outside);
    return out;
  }
  function groundMesh(size, segs, drop) {
    const geo = new THREE.PlaneGeometry(size, size, segs, segs); geo.rotateX(-Math.PI / 2);
    const p = geo.attributes.position, col = new Float32Array(p.count * 3), cov = new Float32Array(p.count), uv = geo.attributes.uv, c = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i); p.setY(i, groundY(x, z) - drop);
      groundColor(x, z, c); col.set([c.r, c.g, c.b], i * 3); cov[i] = cover(x, z); uv.setXY(i, x / 3, z / 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.setAttribute('aCover', new THREE.BufferAttribute(cov, 1)); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, groundMat); m.receiveShadow = true; scene.add(m); return m;
  }
  groundMesh(136, 272, 0);
  groundMesh(900, 225, 0.12);

  // ---------- clump lists ----------
  // each clump: x y z rot | spread hScale lean leanDir | dry tint seed trample | laneDir skipMode chunk 0
  // skipMode 1 = hidden when lanes are on (the lane centre), 2 = hidden when lanes are off (a sight line for the 6 m view)
  const CH = 10, NCH = (2 * FIELD) / CH; // 24 x 24 chunks of 10 m
  function makeList(spacing, seed) {
    const r = mulberry32(seed), raw = [];
    const n = Math.floor((2 * FIELD) / spacing);
    for (let gx = 0; gx < n; gx++) for (let gz = 0; gz < n; gz++) {
      const x = -FIELD + (gx + 0.5 + (r() - 0.5) * 0.92) * spacing, z = -FIELD + (gz + 0.5 + (r() - 0.5) * 0.92) * spacing;
      const edge = Math.max(Math.abs(x), Math.abs(z));
      let dens = cover(x, z) * (1 - 0.55 * smooth(PATCH, PATCH + 40, edge));
      if (Math.hypot(x - F.x, z - F.z) < 0.55 || Math.hypot(x - MAR.x, z - MAR.z) < 0.55 || Math.hypot(x - NEARCAM.x, z - NEARCAM.z) < 0.6) dens = 0;
      if (r() > dens) { r(); r(); r(); r(); r(); r(); r(); continue; }
      const y = groundY(x, z);
      const q = craterQ(x, z);
      let h = 0.86 + 0.26 * (fbm(x * 0.045 + 9, z * 0.045 + 4) - 0.5) * 2 + (r() - 0.5) * 0.26;
      h *= 0.8 + 0.2 * smooth(1.0, 1.6, q);
      const hScale = clamp(h, 0.72, 1.16);
      const spread = 0.82 + r() * 0.4;
      const lean = 0.04 + r() * 0.18, leanDir = r() < 0.35 ? 0.3 + (r() - 0.5) * 0.8 : r() * TAU;
      const dry = clamp(0.5 + (fbm(x * 0.035 - 4, z * 0.035 + 8) - 0.5) * 1.1 + (r() - 0.5) * 0.35, 0, 1);
      const tint = clamp(0.45 * r() + 0.55 * (fbm(x * 0.03 + 17, z * 0.03 - 5) * 1.6 - 0.3), 0, 1), sd = r();
      const L = laneInfo(x, z);
      const tr = 1 - smooth(0.35, 1.1, L.d);
      let skip = 0;
      if (tr > 0.85 && r() < 0.3) skip = 1;
      if (segDist(x, z, NEARCAM, F) < 0.75 && Math.hypot(x - F.x, z - F.z) > 0.9) skip = skip || 2;
      const laneDir = L.ang + (r() - 0.5) * 0.7 + (r() < 0.2 ? Math.PI : 0);
      const cx = clamp(Math.floor((x + FIELD) / CH), 0, NCH - 1), cz = clamp(Math.floor((z + FIELD) / CH), 0, NCH - 1);
      raw.push([x, y, z, r() * TAU, spread, hScale, lean, leanDir, dry, tint, sd, tr, laneDir, skip, cz * NCH + cx, 0]);
    }
    raw.sort((a, b) => a[14] - b[14]);

  const listP = (() => {
    const keep = []; for (let i = 0; i < listB.N; i++) { const sd = listB.data[i * 16 + 10]; if (((sd * 5.13) % 1) < 0.2 && ((sd * 17.7) % 1) < 0.5) keep.push(i); }
    const N = keep.length, data = new Float32Array(N * 16), start = new Int32Array(NCH * NCH).fill(-1), end = new Int32Array(NCH * NCH).fill(-1);
    keep.forEach((src, i) => { data.set(listB.data.subarray(src * 16, src * 16 + 16), i * 16); const k = listB.data[src * 16 + 14]; if (start[k] < 0) start[k] = i; end[k] = i + 1; });
    return { N, data, start, end, ymin: listB.ymin, ymax: listB.ymax };
  })();

  // ---------- ground mask: soft contact shadow under each clump (R) and the lanes (G), 240 m over 2048 px ----------
  {
    const S = 2048, k = S / (2 * FIELD);
    const blob = document.createElement('canvas'); blob.width = blob.height = 64; const bg = blob.getContext('2d');
    const gr = bg.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    bg.fillStyle = gr; bg.fillRect(0, 0, 64, 64);
    const c1 = document.createElement('canvas'); c1.width = c1.height = S; const g1 = c1.getContext('2d');
    g1.fillStyle = '#000'; g1.fillRect(0, 0, S, S); g1.globalAlpha = 0.42;
    for (let i = 0; i < listA.N; i++) { const o = i * 16, x = listA.data[o], z = listA.data[o + 2], rr = 0.62 * listA.data[o + 4] * k; g1.drawImage(blob, (x + FIELD) * k - rr, (z + FIELD) * k - rr, rr * 2, rr * 2); }
    const c2 = document.createElement('canvas'); c2.width = c2.height = S; const g2 = c2.getContext('2d');
    g2.fillStyle = '#000'; g2.fillRect(0, 0, S, S); g2.filter = 'blur(3px)'; g2.strokeStyle = '#fff'; g2.lineCap = g2.lineJoin = 'round';

      varying vec2 vGUv; varying vec4 vGInfo; varying float vVariant; varying float vFace;
      uniform sampler2D uAtlas;
      uniform vec3 uCBase, uCBody, uCTop, uCTip, uCDead0, uCDead1, uCPlume;
      vec3 grassPalette(float t, float dry, float flag) {
        float split = mix(0.66, 0.2, dry);
        vec3 c = mix(uCBase, uCBody, smoothstep(0.0, split, t));
        c = mix(c, uCTop, smoothstep(split, min(split + 0.42, 1.0), t));
        c = mix(c, uCTip, smoothstep(0.8, 1.0, t) * 0.7);
        vec3 d = mix(uCDead0, uCDead1, smoothstep(0.0, 0.8, t));
        c = mix(c, d, clamp(flag * 2.0, 0.0, 1.0));
        return 0.6 * mix(c, uCPlume, clamp(flag * 2.0 - 1.0, 0.0, 1.0));
      }
    #endif
    float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  `;
  const GRASS_COLOR_FRAG = `
    #ifdef GRASS_CARD
      vec2 auv = vec2((vVariant + vGUv.x) * 0.25, 1.0 - vGUv.y);
      vec4 tx = texture2D(uAtlas, auv);
      vec2 tp = auv * vec2(2048.0, 1024.0);
      float mip = max(0.0, 0.25 * log2(max(dot(dFdx(tp), dFdx(tp)) * dot(dFdy(tp), dFdy(tp)), 1e-8)));
      float ga = tx.a * min(1.0 + mip * 0.18, 1.6) * smoothstep(0.08, 0.4, vFace);
      ga = (ga - 0.5) / max(fwidth(ga), 0.0001) + 0.5;
      if (ga < 0.01) discard;
      // texture t is along each painted blade; also darken toward the card root (the clump core)
      float t = tx.r;
      vec3 gc = grassPalette(t, vGInfo.y, tx.b) * vGCol * vGInfo.z * (0.12 + 0.78 * tx.g) * 0.85;
      gc *= mix(vec3(1.0), vec3(1.02, 0.95, 0.8), vGInfo.w);
      diffuseColor = vec4(gc, clamp(ga, 0.0, 1.0));
    #else
      diffuseColor.rgb = vGCol;
    #endif
    float gz = ign(gl_FragCoord.xy);
    #if FADE_MODE == 1
      if (gz >= vFade) discard;
    #elif FADE_MODE == 2
      if (gz < 1.0 - vFade) discard;
    #endif
  `;
  function grassMaterial({ card = false, fadeMode = 0, range = [0, 1e6, 0, 1], shrink = [1e6, 1e6, 2], widen = 0.03, receive = false }) {
    const m = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.9, metalness: 0, envMapIntensity: 0.25 });
    m.defines = { FADE_MODE: fadeMode }; if (card) m.defines.GRASS_CARD = '';
    if (card) { m.alphaToCoverage = true; m.extensions = { derivatives: true }; }
    const own = { uRange: { value: new THREE.Vector4(...range) }, uShrink: { value: new THREE.Vector3(...shrink) }, uWiden: { value: widen } };
    m.userData.own = own; m.userData.receive = receive;
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, U, own);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\n' + GRASS_VERT_PARS)
        .replace('#include <color_vertex>', 'grassMain();')
        .replace('#include <beginnormal_vertex>', 'vec3 objectNormal = gNrm;')
        .replace('#include <begin_vertex>', 'vec3 transformed = gPos;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\n' + GRASS_FRAG_PARS)
        .replace('#include <color_fragment>', GRASS_COLOR_FRAG)
        .replace('#include <normal_fragment_begin>', 'float faceDirection = 1.0; vec3 normal = normalize(vNormal); vec3 geometryNormal = normal;')
        .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * uSunCol * vTrans * 0.55;')
        .replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\nreflectedLight.directSpecular *= 0.12; reflectedLight.indirectSpecular *= 0.12;');
    };
    m.customProgramCacheKey = () => 'grass' + (card ? 'C' : 'B') + fadeMode;
    return m;
  }

  // ---------- buckets: one instanced draw per (geometry, distance band); chunks picked on the CPU when the camera moves ----------
  class Bucket {
    constructor(name, list, geo, mat) {
      this.name = name; this.list = list; this.mat = mat;
      const g = geo.clone(); g.instanceCount = 0; this.geo = g; this.baseTris = geo.userData.tris; this.bladesPer = geo.userData.blades;
      this.arr = []; for (const k of ['iA', 'iB', 'iC', 'iD']) { const a = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, list.N) * 4), 4); a.setUsage(THREE.DynamicDrawUsage); g.setAttribute(k, a); this.arr.push(a); }
      this.mesh = new THREE.Mesh(g, mat); this.mesh.frustumCulled = false; this.mesh.receiveShadow = !!mat.userData.receive; this.mesh.visible = false; scene.add(this.mesh);
      this.n = 0; this.blades = 0; this.clumps = 0;
    }
    get range() { return this.mat.userData.own.uRange.value; }
    fill(frustum, cam, lanes) {
      const L = this.list, R = this.range, box = new THREE.Box3(); let n = 0;
      const A = this.arr.map((a) => a.array);
      const lo = R.x, hi = R.y;
      this.blades = 0; this.clumps = 0;
      for (let cz = 0; cz < NCH; cz++) for (let cx = 0; cx < NCH; cx++) {
        const k = cz * NCH + cx, s = L.start[k]; if (s < 0) continue;
        const x0 = -FIELD + cx * CH, z0 = -FIELD + cz * CH;
        box.min.set(x0 - 2.5, L.ymin[k] - 0.5, z0 - 2.5); box.max.set(x0 + CH + 2.5, L.ymax[k] + 0.5, z0 + CH + 2.5);
        const dmin = box.distanceToPoint(cam), dmax = Math.hypot(Math.max(Math.abs(cam.x - box.min.x), Math.abs(cam.x - box.max.x)), Math.max(Math.abs(cam.y - box.min.y), Math.abs(cam.y - box.max.y)), Math.max(Math.abs(cam.z - box.min.z), Math.abs(cam.z - box.max.z)));
        if (dmax < lo || dmin >= hi || !frustum.intersectsBox(box)) continue;
        const e = L.end[k];
        for (let i = s; i < e; i++) {
          const o = i * 16, d = Math.hypot(L.data[o] - cam.x, L.data[o + 1] - cam.y, L.data[o + 2] - cam.z), sk = L.data[o + 13];
          if (d < lo || d >= hi || (sk === 1 && lanes)) continue;
          A[0].set(L.data.subarray(o, o + 4), n * 4); A[1].set(L.data.subarray(o + 4, o + 8), n * 4); A[2].set(L.data.subarray(o + 8, o + 12), n * 4); A[3].set(L.data.subarray(o + 12, o + 16), n * 4);
          n++; this.clumps++;
          if (this.bladesPer) { const nb = 12 + Math.floor(L.data[o + 10] * 9); const sh = this.mat.userData.own.uShrink.value; this.blades += Math.min(nb, d > sh.y ? Math.round(sh.z * 20) : this.bladesPer); }
        }
      }
      this.n = n; this.geo.instanceCount = n;
      for (const a of this.arr) { a.updateRange.offset = 0; a.updateRange.count = n * 4; a.needsUpdate = true; }
    }
  }
  const BUCKETS = {
    A: [
      new Bucket('A near', listA, geoA0, grassMaterial({ range: [0, 26, 0, 1], shrink: [18, 26, 0.7], receive: true })),
      new Bucket('A mid', listA, geoA1, grassMaterial({ range: [26, 62, 0, 1], shrink: [52, 62, 0.45] })),
      new Bucket('A far', listA, geoA2, grassMaterial({ range: [62, 1e6, 0, 1] })),
    ],
    B: [
      new Bucket('B cards', listB, geoB, grassMaterial({ card: true })),
      new Bucket('B plumes', listP, geoP, grassMaterial({ range: [0, 90, 0, 1] })),
    ],
    C: [
      new Bucket('C blades', listA, geoA0, grassMaterial({ fadeMode: 1, range: [0, 29, 21, 29], receive: true })),
      new Bucket('C cards', listB, geoB, grassMaterial({ card: true, fadeMode: 2, range: [21, 1e6, 21, 29] })),
      new Bucket('C plumes', listP, geoP, grassMaterial({ fadeMode: 2, range: [21, 90, 21, 29] })),
    ],
  };
  const CAPTIONS = {
    A: 'A · blade clumps: 12–20 curved, tapered, twisted 3D blades per tussock, culms and plumes, no alpha; 3 distance levels',
    B: 'B · crossed cards: 3 fan cards per clump with a painted blade atlas (alpha to coverage), 3D plume stems; denser',
    C: 'C · hybrid: A within 25 m, B beyond (dithered 21–29 m), trampled lanes, bare crater bowls',
  };

  // ---------- the height references: a 1.78 m grey capsule and the realistic Marine ----------
  {
    const R = 0.21, H = 1.78, pts = [];
    for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * R, R + Math.sin(a) * R)); }
    for (let i = 0; i <= 8; i++) { const a = (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * R, H - R + Math.sin(a) * R)); }
    const cap = new THREE.Mesh(new THREE.LatheGeometry(pts, 24), new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.7 }));
    FIGMATS.push(cap.material); cap.material.envMap = envTex; cap.position.copy(F); cap.castShadow = true; cap.receiveShadow = true; scene.add(cap);
  }
  let marine = null, mixer = null;
  const glbP = new Promise((res) => {
    new THREE.GLTFLoader().load('../realistic-spike/marine-lod.glb', (g) => {
      marine = g.scene; marine.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; o.material.envMap = envTex; FIGMATS.push(o.material); } });
      marine.position.copy(MAR); marine.rotation.y = 0.5; scene.add(marine);
      const clip = g.animations.find((c) => /stand/i.test(c.name)) || g.animations[0];
      if (clip) { mixer = new THREE.AnimationMixer(marine); mixer.clipAction(clip).play(); }
      res(true);
    }, undefined, () => { console.warn('marine-lod.glb did not load; the capsule stands alone'); res(false); });
    setTimeout(() => res(false), 15000);
  });

  // ---------- cameras ----------
  const CAMS = {
    near: () => { const p = NEARCAM.clone(); p.y = groundY(p.x, p.z) + 1.65; return [p, F.clone().add(new THREE.Vector3(0.4, 1.25, 0))]; },
    mid: () => { const d = new THREE.Vector3(0.36, 0, 1).normalize(); const p = F.clone().addScaledVector(d, 37); p.y = F.y + 15; return [p, F.clone().add(new THREE.Vector3(0, 0.9, 0))]; },
    wide: () => { const d = new THREE.Vector3(0.3, 0, 1).normalize(); const p = F.clone().addScaledVector(d, 136); p.y = F.y + 62; return [p, F.clone().add(new THREE.Vector3(-4, 0, -14))]; },
  };
  const orbit = { target: new THREE.Vector3(), yaw: 0, pitch: 0, dist: 10 };
  let camDirty = true;
  function setCam(name) {
    let p, t;
    const cp = P.get('cam') && !CAMS[name] ? P.get('cam').split(',').map(Number) : null;
    if (cp && cp.length === 6) { p = new THREE.Vector3(cp[0], cp[1], cp[2]); t = new THREE.Vector3(cp[3], cp[4], cp[5]); } else [p, t] = (CAMS[name] || CAMS.mid)();
    orbit.target.copy(t); const d = p.clone().sub(t); orbit.dist = d.length(); orbit.yaw = Math.atan2(d.x, d.z); orbit.pitch = Math.asin(d.y / orbit.dist);
    camDirty = true;
  }
  setCam(P.get('cam') || 'mid');
  function placeCam() {
    const cp = Math.cos(orbit.pitch);
    camera.position.set(orbit.target.x + Math.sin(orbit.yaw) * cp * orbit.dist, orbit.target.y + Math.sin(orbit.pitch) * orbit.dist, orbit.target.z + Math.cos(orbit.yaw) * cp * orbit.dist);
    const gy = groundY(camera.position.x, camera.position.z) + 0.4; if (camera.position.y < gy) camera.position.y = gy;
    camera.lookAt(orbit.target); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
  }
  {
    let drag = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
    renderer.domElement.addEventListener('pointermove', (e) => { if (!drag) return; orbit.yaw -= (e.clientX - drag.x) * 0.005; orbit.pitch = clamp(orbit.pitch + (e.clientY - drag.y) * 0.004, -0.2, 1.45); drag = { x: e.clientX, y: e.clientY }; camDirty = true; });
    renderer.domElement.addEventListener('pointerup', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); orbit.dist = clamp(orbit.dist * Math.exp(e.deltaY * 0.001), 1.5, 400); camDirty = true; }, { passive: false });
  }
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === '1' || k === '2' || k === '3') setMode('ABC'[Number(k) - 1]);
    else if (k === 'q') setCam('near'); else if (k === 'w') setCam('mid'); else if (k === 'e') setCam('wide');
    else if (k === 'n') { DUSK = !DUSK; applyLight(); }
  });
  function setMode(m) {
    MODE = m; U.uLanes.value = m === 'C' ? 1 : 0;
    for (const key of 'ABC') for (const b of BUCKETS[key]) b.mesh.visible = false;
    document.getElementById('caption').textContent = CAPTIONS[m] + (DUSK ? ' · dusk' : ' · 1430, 16 April');
    camDirty = true;
  }
  setMode(MODE);

  // ---------- frame ----------
  const hud = document.getElementById('fps'), frustum = new THREE.Frustum(), pm = new THREE.Matrix4();
  let last = performance.now(), frames = 0, fpsT = 0, fps = 0, bench = '', blades = 0, clumps = 0;
  function refill() {
    placeCam();
    pm.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); frustum.setFromProjectionMatrix(pm);
    U.uCam.value.copy(camera.position);
    blades = 0; clumps = 0;
    for (const b of BUCKETS[MODE]) { b.fill(frustum, camera.position, MODE === 'C'); b.mesh.visible = b.n > 0; blades += b.blades; clumps += b.clumps; }
    // the sun's shadow box follows the figures
    sun.position.copy(F).addScaledVector(U.uSunDir.value, 30); sun.target.position.copy(F);
    camDirty = false;
  }
  function render(t) {
    U.uTime.value = t;
    if (camDirty) refill();
    renderer.render(scene, camera);
  }
  function statsLine() {
    const ri = renderer.info.render;
    return `${fps} fps · ${ri.calls} draws · ${ri.triangles.toLocaleString('en-US')} tris · ${MODE} · ${clumps.toLocaleString('en-US')} clumps · ${blades.toLocaleString('en-US')} 3D blades${bench}`;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (mixer) mixer.update(dt);
    render(T0 + now / 1000);
    frames++; fpsT += dt; if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = statsLine();
  }
  window.__bench = (n = 60) => { // synchronous: each frame waits for the GPU (readPixels), so this is an upper bound on frame time
    const gl = renderer.getContext(), px = new Uint8Array(4);
    for (let i = 0; i < 5; i++) { render(T0 + i / 30); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    const t0 = Date.now(); for (let i = 0; i < n; i++) { render(T0 + i / 30); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    const ms = (Date.now() - t0) / n; bench = ` · bench ${ms.toFixed(1)} ms (${Math.round(1000 / ms)} fps)`; return ms;
  };
  window.__study = { U, BUCKETS, listA, listB, listP, setMode, setCam, refill };
  await glbP;
  if (mixer) mixer.update(0);
  if (P.has('bench')) window.__bench(60);
  requestAnimationFrame(frame);
  window.__ready = true;
})();
</script>
</body>
</html>
