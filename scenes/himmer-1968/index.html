  // The land runs to kilometres: the far plane reaches the haze, the near plane leaves room for 6 m figure views.
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 9000);

  // down in the valleys, warm towards the sun. Every lit material gets it (the frame loop adds it to new ones).
  const FOGU = { sky: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 0.1, -1) }, sunCol: { value: new THREE.Color() }, dens: { value: 0.0007 } };
  THREE.ShaderChunk.fog_pars_vertex += '\n#ifdef USE_FOG\nvarying vec3 vFogWorld;\n#endif';
  THREE.ShaderChunk.fog_vertex += '\n#if defined(USE_FOG) && defined(SKY_FOG)\n#ifdef USE_INSTANCING\nvFogWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;\n#else\nvFogWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;\n#endif\n#endif';

    '  float fDist = length(fRay);',
    '  vec3 fDir = fRay / fDist;',
    '  float fAmt = 1.0 - exp(-uFogDens * uFogDens * fDist * fDist);',
    // the haze lies in the valleys: thinner over the crests (y is about 0 at 450 m, 104 on Hill 689)
    '  fAmt *= mix(1.0, 0.6, smoothstep(-10.0, 110.0, vFogWorld.y));',
    '  vec3 fCol = mix(fogColor, uFogSky, smoothstep(-0.02, 0.32, fDir.y));',
    '  fCol += uSunCol * pow(max(dot(fDir, uSunDir), 0.0), 6.0);',
    '  float fLum = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));',
    '  gl_FragColor.rgb = mix(gl_FragColor.rgb, mix(vec3(fLum), fCol, 0.3), clamp(fAmt * 0.7, 0.0, 1.0));',
    '  gl_FragColor.rgb = mix(gl_FragColor.rgb, fCol, clamp(fAmt * 0.9, 0.0, 1.0));',
    '#else',
    THREE.ShaderChunk.fog_fragment,
    '#endif',

  // ---------- helpers (plug-ins get them on ctx) ----------
  const matCache = new Map();
  function mat(color, extra) {

    if (!quiet) { user.on = false; startEase(); }

    if (changed || !quiet) for (const fn of chapterListeners) { try { fn(chapter, prevId); } catch (e) { console.error(e); } }
  }
  function syncCycle() {
    const local = clock.elapsed - chap.start, L = CHAPTERS[chap.i].loop;
    cycle.t = ((local % L) + L) % L;
    cycle.n = Math.floor(local / L);
    const ch = CHAPTERS[chap.i];
    chapter.minutes = clockMinutes(ch, cycle.t);
    chapter.clock = fmtClock(chapter.minutes);
  }
  window.__chapters = { go: goChapter, CHAPTERS, chap, chapter };
  {
    const id0 = Number(params.get('ch')) || 1;
    if (TOUR) tourStep = 0;
    goChapter(TOUR ? TOUR_STEPS[0].ch : id0, Number(params.get('t0')) || 0, true);
    // first load without a chosen chapter: open on the home view, then ease into chapter 1's
    if (!params.has('ch') && !params.has('t0') && !TOUR && !VIEW && !CAM) {
      viewAt(HOME_VIEW, 0, 60, camPos, camLook);
      startEase(4.5, 2.5);
    } else {
      viewAt(TOUR ? TOUR_STEPS[0].view : (VIEW === 'home' ? HOME_VIEW : CHAPTERS[chap.i].view), cycle.t, CHAPTERS[chap.i].loop, camPos, camLook);
    }
  }

  // ---------- the frame loop ----------
  const fpsEl = document.getElementById('fps'), blurbEl = document.getElementById('blurb'), seamEl = document.getElementById('seam');
  // The loop seam (LOOP SEAM): a chapter whose story runs one way (men fall and stay down, a column crosses the valley)
  // fades to black over its last SEAM_FADE seconds and back up over the first SEAM_FADE of the next loop, so the cut
  // back to its start is never seen. Chapters with seam: 'cut' (idle only) loop continuously. The first entry into a
  // chapter does not fade up (the camera eases in instead). Plug-ins read ctx.seam (0..1) if they want to hide a reset.
  const SEAM_FADE = 1.5;
  function seamAt() {
    const ch = CHAPTERS[chap.i];
    if (ch.seam === 'cut' || params.get('seam') === '0') { ctx.seam = 0; return 0; }
    const L = ch.loop, t = cycle.t;
    const out = smooth01((t - (L - SEAM_FADE)) / SEAM_FADE);
    const back = cycle.n > 0 ? 1 - smooth01(t / SEAM_FADE) : 0;
    const k = Math.max(out, back);
    ctx.seam = k;
    return k;
  }
  const sunTmp = new THREE.Vector3();
  let last = performance.now(), fpsFrames = 0, fpsTime = 0, rafId = null, frameNo = 0, merged = false;
  const CAPTURE = params.has('capture');
  function frame() {
    if (!CAPTURE) rafId = requestAnimationFrame(frame);
    const now = performance.now();
    const dt = CAPTURE ? 1 / 30 : Math.min((now - last) / 1000, 0.1);
    last = now;
    clock.elapsed += dt;
    const t = clock.elapsed;
    if (TOUR) {
      tourAt += dt;
      if (tourAt >= TOUR_STEP) { tourAt = 0; tourStep = (tourStep + 1) % TOUR_STEPS.length; const st = TOUR_STEPS[tourStep]; if (st.ch !== chapter.id) goChapter(st.ch, 0); else startEase(5); }
    }
    syncCycle();

    // on the first frame: merge the static world (the plug-ins have built by now)
    if (!merged) {
      merged = true;
      mergeGroup(world, true);
    }

    // the light: the chapter's preset, blending from the last one after a change
    {
      const k = smooth01((performance.now() / 1000 - lp.start) / LIGHT_BLEND);
      // dusk ends with the first stars, and they fade back out as the loop starts again (DESIGN.md 9, chapter 8)
      const ch = CHAPTERS[chap.i];
      const extra = ch.starsAtEnd && TIME === 'chapter' ? 0.55 * smooth01((cycle.t / ch.loop - 0.72) / 0.22) * (1 - smooth01((cycle.t / ch.loop - 0.985) / 0.015)) + 0.55 * (1 - smooth01(cycle.t / 1.5)) * (cycle.n > 0 ? 1 : 0) : 0;
      if (k < 1) { applyLight(blendState(lp.from, lp.to, k, lightNow), extra); lightApplied = null; }
      else if (lightApplied !== lp.to || extra !== lightExtra) {
        // settled: no blending (nothing allocated per frame); lightNow keeps the state a later change blends from
        lp.cur = lp.to;
        if (lightApplied !== lp.to) Object.assign(lightNow, lp.to);
        applyLight(lp.to, extra);
        lightApplied = lp.to; lightExtra = extra;
      }
      // the key light rides with the camera's focus, so a shadow map (when on) covers what is in view
      sunLight.position.copy(camLook).addScaledVector(keyDir, 400);
      sunLight.target.position.copy(camLook);
    }

    placeCamera(t);
    sky.position.copy(camera.position);
    starMat.uniforms.uTime.value = t;
    SUN.getWorldPosition(sunTmp);
    FOGU.sunDir.value.copy(sunTmp.sub(camera.position)).normalize();

    // a blurb at the bottom of the screen while its moment lasts (in the chapter's loop time)
    {
      const p = cycle.t;
      let b = 0;
      for (const B of blurbs) {
        if (B.ch && B.ch !== chapter.id) continue;
        const k = smooth01((p - B.from) / 1.2) * (1 - smooth01((p - (B.to - 1.5)) / 1.5));
        if (k > b) { b = k; if (blurbEl.dataset.text !== B.text) { blurbEl.dataset.text = B.text; blurbEl.firstChild.textContent = B.text; blurbEl.lastChild.textContent = B.ref || ''; } }
      }
      blurbEl.style.opacity = b.toFixed(3);
    }
    seamEl.style.opacity = seamAt().toFixed(3);

    // wind: a steady breeze, and a gust now and then (periodic in real time, not tied to a chapter)
    windUniform.value = t;
    const gp = (t % 47 - 30) / 6;
    wind.gust = gp > 0 && gp < 1 ? Math.sin(Math.PI * gp) : 0;
    gustUniform.value = wind.gust;
    wind.strength = 0.6 + 0.6 * wind.gust;
    for (const c of clouds) { c.g.position.x += c.speed * dt; if (c.g.position.x > 2400) c.g.position.x = -2400; }

    // lamps: on in the dark; one lit early (ctx.lightLantern) stays on a minute
    {
      const night = smooth01((0.75 - light.day) / 0.4), a = lanternGeo.attributes.aGlow;
      for (let i = 0; i < lanterns.length; i++) {
        const L = lanterns[i];
        if (L.litAt >= 0 && light.day > 0.95 && t - L.litAt > 60) L.litAt = -1;
        const early = L.litAt >= 0 ? smooth01((t - L.litAt) / 0.8) : 0;
        a.array[i] = Math.max(night, early) * (0.85 + 0.15 * Math.sin(t * 7 + i * 1.7));
      }
      a.needsUpdate = true;
    }

    for (const p of plugins) {
      if (p.failed || !p.update) continue;
      try { p.update(t, dt, ctx); } catch (e) { console.error('plug-in ' + p.name + ' failed', e); p.failed = true; }
    }

    // give every lit mesh material the sky haze, including ones the plug-ins create later
    if (frameNo++ % 120 === 0) scene.traverse((o) => {
      const m = o.material;
      if (!o.isMesh || !m || Array.isArray(m) || m.userData.skyFog || m.fog === false || m.isShaderMaterial || m.isMeshBasicMaterial) return;
      addSkyFog(m);
    });

    renderer.render(scene, camera);
    placeTag();
    placeStory();

    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      const info = renderer.info.render;
      fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' fps · ' + info.calls + ' draws · ' + (info.triangles / 1000).toFixed(1) + 'k tris · ch ' + chapter.id + ' · ' + cycle.t.toFixed(0) + ' s';
      fpsFrames = 0; fpsTime = 0;
    }
  }
  if (CAPTURE) window.__capture = () => { frame(); return renderer.domElement.toDataURL('image/jpeg', 0.93); };
  window.__frame = frame;
  window.__land = { groundY, realH, landCls, LAND, tile, NX, NZ };
  window.__camera = camera; window.__scene = scene; window.__keepOffFaces = keepOffFaces;   // for the tools (face-distance checks)
  // Start only once every plug-in's script has loaded and built: the first frame merges the static world, so a frame
  // drawn earlier leaves the plug-ins' scenery unmerged and anything meant to be hidden showing.
  let loaded = document.readyState === 'complete';
  const start = () => { if (!CAPTURE && !document.hidden && rafId === null) { last = performance.now(); rafId = requestAnimationFrame(frame); } };
  if (!loaded) addEventListener('load', () => { loaded = true; start(); });
  document.addEventListener('visibilitychange', () => {
    if (CAPTURE) return;
    if (document.hidden) { if (rafId !== null) cancelAnimationFrame(rafId); rafId = null; }
    else if (loaded) start();
  });
  if (loaded) start();
})();
</script>
<!-- the scene's plug-ins, one file each (DESIGN.md 8); add each here as its builder delivers it:
     land.js, works.js, marines-a-d.js, marines-c.js, nva.js, fire.js, radio.js, medevac.js -->
<script src="land.js"></script>
<script src="works.js"></script>
<script src="medevac.js"></script>
<script src="fire.js"></script>
<script src="radio.js"></script>
<script src="nva.js"></script>
<script src="marines-a-d.js"></script>
<script src="marines-c.js"></script>
<script src="markers.js"></script>
</body>
